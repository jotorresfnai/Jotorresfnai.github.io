name: Gerar páginas dos imóveis

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate-properties.mjs"
      - ".github/workflows/generate-properties.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar gerador
        run: |
          test -f scripts/generate-properties.mjs
          node --check scripts/generate-properties.mjs

      - name: Gerar páginas dos imóveis
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/generate-properties.mjs

      - name: Validar páginas geradas
        run: |
          test -f sitemap.xml
          test -d imoveis
          test -f fnai_logo_transparente.png
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'imoveis';
          const dirs = fs.readdirSync(root, { withFileTypes: true }).filter(e => e.isDirectory());
          if (!dirs.length) throw new Error('Nenhum imóvel foi gerado');
          for (const dir of dirs) {
            const file = path.join(root, dir.name, 'index.html');
            if (!fs.existsSync(file)) throw new Error(`Página em falta: ${file}`);
            const html = fs.readFileSync(file, 'utf8');
            if (!html.includes('gallery-watermark')) throw new Error(`Watermark FNAI em falta: ${file}`);
            if (!html.includes('/fnai_logo_transparente.png')) throw new Error(`Logo FNAI em falta: ${file}`);
          }
          console.log(`Validação concluída: ${dirs.length} páginas de imóveis.`);
          NODE

      - name: Guardar páginas geradas no Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imoveis sitemap.xml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para guardar."
            exit 0
          fi
          git commit -m "chore: regenerar páginas dos imóveis"
          git push
