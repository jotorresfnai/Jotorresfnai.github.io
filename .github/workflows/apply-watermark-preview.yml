name: Apply approved FNAI watermark

on:
  push:
    branches: [watermark-public-2026-08-21]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved watermark
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('imoveis.html')
          s = p.read_text(encoding='utf-8')
          old_css = '''    .fnai-watermark {

      position: absolute;

      right: 14px;

      bottom: 12px;

      z-index: 6;

      color: rgba(255,255,255,.9);

      font-size: 20px;

      font-weight: 900;

      letter-spacing: 2px;

      text-shadow:
        0 1px 4px rgba(0,0,0,.8);

      pointer-events: none;
    }'''
          new_css = '''    .fnai-watermark {

      position: absolute;

      left: 50%;

      top: 50%;

      right: auto;

      bottom: auto;

      transform: translate(-50%, -50%);

      width: 100px;

      height: auto;

      z-index: 5;

      opacity: .80;

      pointer-events: none;
    }'''
          old_html = '''          <div class="fnai-watermark">
            FNAI
          </div>'''
          new_html = '''          <img
            class="fnai-watermark"
            src="fnai_logo_transparente.png"
            alt="FNAI"
            width="100"
            height="66"
          >'''
          if old_css not in s:
              raise SystemExit('Expected watermark CSS was not found; aborting safely.')
          if old_html not in s:
              raise SystemExit('Expected watermark HTML was not found; aborting safely.')
          s = s.replace(old_css, new_css, 1).replace(old_html, new_html, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imoveis.html
          git commit -m "Apply approved FNAI watermark" || exit 0
          git push
