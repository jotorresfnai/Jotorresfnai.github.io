name: Final site cleanup
on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fix-final.mjs
      - name: Restaurar galeria original no imovel.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("imovel.html")
          if not path.exists():
              raise SystemExit("imovel.html não encontrado")

          html = path.read_text(encoding="utf-8")

          # Remover qualquer fallback extra que possa criar loops.
          html = re.sub(r'\s*<script id="jo-gallery-thumbnails-restore(?:-v3-js|-final-js)">[\s\S]*?</script>\s*', '\n', html)
          html = re.sub(r'\s*<style id="jo-gallery-thumbnails-restore(?:-v2|-v3|-final)">[\s\S]*?</style>\s*', '\n', html)

          # Foto principal em bloco próprio; miniaturas ficam abaixo, fora da foto.
          html = html.replace(
              '.gallery{position:relative;height:min(68vw,680px);min-height:360px;background:#0c191c;border-radius:18px;overflow:hidden}',
              '.gallery{position:relative;height:auto;min-height:0;background:#fff;border-radius:18px;overflow:visible}'
          )
          html = html.replace(
              '.gallery-main{width:100%;height:100%;object-fit:cover;display:block}',
              '.gallery-main{width:100%;height:min(68vw,680px);min-height:360px;object-fit:cover;display:block;border-radius:18px}'
          )
          html = html.replace(
              '.thumbs{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;overflow:auto;padding:10px;background:rgba(7,23,27,.55);border-radius:10px}',
              '.thumbs{position:static;left:auto;right:auto;bottom:auto;display:flex;gap:8px;overflow:auto;padding:10px;margin-top:12px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.06)}'
          )
          html = html.replace(
              '.thumb{width:70px;height:50px;flex:0 0 70px;padding:0;border:2px solid transparent;border-radius:7px;overflow:hidden;background:#07171b;cursor:pointer}',
              '.thumb{width:70px;height:50px;flex:0 0 70px;padding:0;border:2px solid transparent;border-radius:7px;overflow:hidden;background:#fff;cursor:pointer}'
          )

          path.write_text(html, encoding="utf-8")
          print("Galeria restaurada: foto principal + miniaturas fora da foto, fundo claro.")
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html imoveis.html imovel.html imoveis scripts/fix-final.mjs .github/workflows/fix-final.yml || true
          git diff --cached --quiet && exit 0
          git commit -m "fix: restaurar slideshow sem loop e com miniaturas fora da foto"
          git push
