name: Gerar páginas dos imóveis

on:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-properties.mjs"
      - "scripts/add-gallery-slideshow.mjs"
      - "scripts/generate-sitemap.mjs"
      - ".github/workflows/generate-properties.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_REGENERATION: "true"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar geradores
        run: |
          test -f scripts/generate-properties.mjs
          test -f scripts/generate-sitemap.mjs
          test -f scripts/add-gallery-slideshow.mjs
          node --check scripts/generate-properties.mjs
          node --check scripts/generate-sitemap.mjs
          node --check scripts/add-gallery-slideshow.mjs

      - name: Gerar páginas dos imóveis
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node scripts/generate-properties.mjs
          node scripts/add-gallery-slideshow.mjs

      - name: Gerar sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Validar páginas e sitemap
        run: |
          test -f sitemap.xml
          test -f imoveis.html
          node - <<'NODE'
          const fs = require('fs');
          const xml = fs.readFileSync('sitemap.xml', 'utf8');
          if (!xml.startsWith('<?xml version="1.0" encoding="UTF-8"?>')) throw new Error('Sitemap XML inválido');
          if (!xml.includes('<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">')) throw new Error('Namespace do sitemap inválido');
          const urls = [...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map(m => m[1]);
          if (new Set(urls).size !== urls.length) throw new Error('Sitemap contém URLs duplicados');
          for (const url of urls) {
            if (!url.startsWith('https://jotorresfnai.github.io/')) throw new Error(`URL fora do domínio: ${url}`);
          }
          const legacy = urls.filter(url => /\/imoveis\/[^/]+\/$/.test(url));
          if (legacy.length) throw new Error(`Sitemap contém ${legacy.length} URLs antigas /imoveis/<slug>/`);
          console.log(`Sitemap válido: ${urls.length} URLs.`);
          NODE
          echo "Páginas geradas:"
          find imoveis -mindepth 2 -maxdepth 2 -name index.html | sort

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publish:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
