<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TESTE NOVO IMOVEL</title>
  <meta name="description" content="Detalhes do imóvel - Jo Torres, Consultor Imobiliário">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --gold:#d3a72c;
      --ink:#07171b;
      --muted:#657174;
      --cream:#f7f5ef;
      --white:#fff;
      --line:#e6e3db;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--cream);
      color:var(--ink);
      font-family:"DM Sans",Arial,sans-serif;
    }
    a{color:inherit;text-decoration:none}
    .topbar{
      min-height:82px;
      padding:18px 5vw;
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:#07171b;
      color:#fff;
      gap:24px;
    }
    .brand{display:flex;align-items:center;gap:12px}
    .brand-mark{
      width:45px;height:45px;border:1px solid var(--gold);border-radius:50%;
      display:grid;place-items:center;color:var(--gold);font-weight:700
    }
    .brand strong{display:block;font-size:16px;letter-spacing:.08em}
    .brand span{display:block;color:var(--gold);font-size:11px;letter-spacing:.14em;margin-top:4px}
    .back{
      border:1px solid rgba(255,255,255,.3);padding:11px 16px;border-radius:5px;
      font-size:14px
    }
    .wrap{width:min(1180px,92vw);margin:48px auto 90px}
    .loading,.error{
      min-height:320px;display:grid;place-items:center;text-align:center;
      background:#fff;border:1px solid var(--line);padding:40px
    }
    .error h2{font-family:"Playfair Display",serif;font-size:36px;margin:0 0 10px}
    .property-head{margin-bottom:28px}
    .eyebrow{
      color:var(--gold);font-weight:700;letter-spacing:.18em;font-size:12px;
      text-transform:uppercase;margin-bottom:10px
    }
    h1{
      font-family:"Playfair Display",Georgia,serif;
      font-size:clamp(38px,5vw,68px);line-height:1.02;margin:0 0 12px
    }
    .location{color:var(--muted);font-size:17px}
    .gallery{
      position:relative;background:#0b181b;border-radius:4px;overflow:hidden;
      box-shadow:0 18px 50px rgba(0,0,0,.12)
    }
    .slide{
      display:none;width:100%;height:min(68vh,680px);min-height:420px;
      position:relative;background:#111
    }
    .slide.active{display:block}
    .slide img{
      width:100%;height:100%;display:block;object-fit:contain;background:#101819
    }
    .counter{
      position:absolute;right:18px;top:18px;z-index:5;background:rgba(0,0,0,.6);
      color:#fff;padding:8px 11px;border-radius:3px;font-size:13px
    }
    .arrow{
      position:absolute;top:50%;transform:translateY(-50%);z-index:5;
      width:50px;height:50px;border:0;border-radius:50%;
      background:rgba(255,255,255,.92);color:var(--ink);font-size:30px;
      cursor:pointer;display:grid;place-items:center
    }
    .arrow:hover{background:#fff}
    .prev{left:18px}.next{right:18px}
    .thumbs{
      display:flex;gap:10px;overflow-x:auto;padding:12px 2px 4px;
      scrollbar-width:thin
    }
    .thumb{
      flex:0 0 96px;height:70px;padding:0;border:2px solid transparent;
      background:#ddd;cursor:pointer;border-radius:3px;overflow:hidden
    }
    .thumb.active{border-color:var(--gold)}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .details{
      display:grid;grid-template-columns:1.25fr .75fr;gap:48px;margin-top:54px
    }
    .description,.facts{
      background:#fff;padding:36px;border:1px solid var(--line)
    }
    h2{
      font-family:"Playfair Display",Georgia,serif;font-size:36px;margin:0 0 22px
    }
    .description p{color:#536064;line-height:1.8;font-size:16px;white-space:pre-line}
    .facts{align-self:start}
    .price{font-size:30px;font-weight:700;margin-bottom:25px}
    .facts-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
    .fact{padding:17px 5px;border-bottom:1px solid var(--line)}
    .fact small{display:block;color:#7a8587;text-transform:uppercase;letter-spacing:.1em;font-size:10px;margin-bottom:5px}
    .contact-box{margin-top:28px;padding:22px;background:var(--ink);color:#fff}
    .contact-box strong{display:block;font-size:18px;margin-bottom:8px}
    .contact-box a{display:inline-block;color:var(--gold);margin-top:8px}
    .empty-gallery{
      height:500px;display:grid;place-items:center;color:#fff;text-align:center;
      padding:30px
    }
    @media(max-width:800px){
      .topbar{padding:15px 4vw}
      .wrap{width:min(94vw,1180px);margin-top:30px}
      .slide{height:58vh;min-height:300px}
      .details{grid-template-columns:1fr;gap:20px;margin-top:28px}
      .description,.facts{padding:25px}
      .arrow{width:43px;height:43px;font-size:25px}
      .brand span{font-size:9px}
    }
  </style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <div class="brand-mark">JT</div>
    <div>
      <strong>JO TORRES</strong>
      <span>CONSULTOR IMOBILIÁRIO</span>
    </div>
  </a>
  <a class="back" href="imoveis.html">← Voltar aos imóveis</a>
</header>

<main class="wrap">
  <div id="app" class="loading">A carregar o imóvel...</div>
</main>

<script>
const SUPABASE_URL = "https://scmorocdbdyvnxodpwyi.supabase.co";
const SUPABASE_KEY = "sb_publishable_W28Qdq8POfYXjCu3BwUxPQ_2z2o2GcM";
const STORAGE_BUCKET = "imoveis";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const id = new URLSearchParams(location.search).get("id");

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}
function money(v){
  if(v===null || v===undefined || v==="") return "Preço sob consulta";
  return new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(v);
}
function isImageUrl(v){
  return typeof v==="string" && (
    /^https?:\/\//i.test(v) ||
    /^\/?[^ ]+\.(jpg|jpeg|png|webp|gif)(\?.*)?$/i.test(v)
  );
}
function collectImages(row){
  const result=[];
  const priority=/imagem|image|foto|fotografia|photos|imagens/i;

  function walk(value,key=""){
    if(value==null) return;
    if(typeof value==="string"){
      if(isImageUrl(value)) result.push({url:value,priority:priority.test(key)});
      return;
    }
    if(Array.isArray(value)){
      value.forEach((x,i)=>walk(x,key+" "+i));
      return;
    }
    if(typeof value==="object"){
      Object.entries(value).forEach(([k,v])=>walk(v,key+" "+k));
    }
  }
  walk(row);
  result.sort((a,b)=>Number(b.priority)-Number(a.priority));
  return [...new Map(result.map(x=>[x.url,x])).values()].map(x=>x.url);
}

async function storageImages(propertyId){
  const found=[];
  try{
    const {data,error}=await db.storage.from(STORAGE_BUCKET).list(String(propertyId),{
      limit:100,offset:0,sortBy:{column:"name",order:"asc"}
    });
    if(!error && data){
      for(const file of data){
        if(!/\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)) continue;
        const path=String(propertyId)+"/"+file.name;
        const {data:pub}=db.storage.from(STORAGE_BUCKET).getPublicUrl(path);
        if(pub?.publicUrl) found.push(pub.publicUrl);
      }
    }
  }catch(e){ console.warn("Storage:",e); }
  return found;
}

async function load(){
  const app=document.getElementById("app");
  if(!id){
    app.className="error";
    app.innerHTML="<div><h2>Imóvel não encontrado</h2><p>O endereço não contém o identificador do imóvel.</p></div>";
    return;
  }

  const {data:row,error}=await db.from("imoveis").select("*").eq("id",id).maybeSingle();

  if(error || !row){
    console.error(error);
    app.className="error";
    app.innerHTML="<div><h2>Não foi possível abrir o imóvel</h2><p>Confirme se o imóvel existe e está publicado.</p></div>";
    return;
  }

  let images=collectImages(row);
  const storage=await storageImages(row.id);
  images=[...new Set([...storage,...images])];

  // Se existir imagem_capa, coloca-a sempre primeiro.
  if(row.imagem_capa && isImageUrl(row.imagem_capa)){
    images=[row.imagem_capa,...images.filter(x=>x!==row.imagem_capa)];
  }

  const title=row.titulo || "Imóvel";
  const location=row.localizacao || "";
  const description=row.descricao || "Para mais informações, entre em contacto comigo.";
  const facts=[
    ["Tipo",row.tipo],
    ["Área",row.area ? row.area+" m²" : null],
    ["Quartos",row.quartos],
    ["Casas de banho",row.casas_banho],
    ["Estado",row.estado || "Disponível"]
  ].filter(x=>x[1]!==null && x[1]!==undefined && x[1]!=="");

  app.className="";
  app.innerHTML=`
    <div class="property-head">
      <div class="eyebrow">${esc(row.estado || "VENDA")}</div>
      <h1>${esc(title)}</h1>
      <div class="location">${esc(location)}</div>
    </div>

    <section class="gallery" id="gallery">
      ${images.length ? images.map((src,i)=>`
        <div class="slide ${i===0?"active":""}" data-index="${i}">
          <img src="${esc(src)}" alt="${esc(title)} - fotografia ${i+1}">
        </div>
      `).join("") : `<div class="empty-gallery">Este imóvel ainda não tem fotografias publicadas.</div>`}

      ${images.length>1 ? `
        <div class="counter"><span id="current">1</span> / ${images.length}</div>
        <button class="arrow prev" aria-label="Fotografia anterior">‹</button>
        <button class="arrow next" aria-label="Fotografia seguinte">›</button>
      `:""}
    </section>

    ${images.length>1 ? `
      <div class="thumbs" aria-label="Miniaturas">
        ${images.map((src,i)=>`
          <button class="thumb ${i===0?"active":""}" data-index="${i}" aria-label="Ver fotografia ${i+1}">
            <img src="${esc(src)}" alt="">
          </button>
        `).join("")}
      </div>
    `:""}

    <section class="details">
      <article class="description">
        <div class="eyebrow">DETALHES</div>
        <h2>${esc(title)}</h2>
        <p>${esc(description)}</p>
      </article>

      <aside class="facts">
        <div class="price">${money(row.preco)}</div>
        <div class="facts-grid">
          ${facts.map(([k,v])=>`<div class="fact"><small>${esc(k)}</small>${esc(v)}</div>`).join("")}
        </div>
        <div class="contact-box">
          <strong>Quer saber mais?</strong>
          <span>Fale diretamente comigo.</span><br>
          <a href="https://wa.me/41792601145" target="_blank" rel="noopener">Contactar pelo WhatsApp →</a>
        </div>
      </aside>
    </section>
  `;

  if(images.length>1){
    let current=0;
    const slides=[...document.querySelectorAll(".slide")];
    const thumbs=[...document.querySelectorAll(".thumb")];
    const counter=document.getElementById("current");

    function show(n){
      current=(n+slides.length)%slides.length;
      slides.forEach((el,i)=>el.classList.toggle("active",i===current));
      thumbs.forEach((el,i)=>el.classList.toggle("active",i===current));
      counter.textContent=current+1;
    }
    document.querySelector(".prev").onclick=()=>show(current-1);
    document.querySelector(".next").onclick=()=>show(current+1);
    thumbs.forEach(t=>t.onclick=()=>show(Number(t.dataset.index)));

    let timer=setInterval(()=>show(current+1),5000);
    const gallery=document.getElementById("gallery");
    gallery.addEventListener("mouseenter",()=>clearInterval(timer));
    gallery.addEventListener("mouseleave",()=>timer=setInterval(()=>show(current+1),5000));
  }
}
load();
</script>
</body>
</html>
