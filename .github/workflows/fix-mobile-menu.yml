name: Fix mobile menu visibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip mobile fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix mobile navigation stacking
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [Path('scripts/generate-properties.mjs'), Path('imovel.html')]
          files += list(Path('imoveis').glob('*/index.html'))

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              # The mobile menu is absolutely positioned. Keep the header above
              # the gallery/content so the opened menu cannot be painted behind it.
              text = text.replace(
                  '.header{height:82px;background:var(--dark);',
                  '.header{position:relative;z-index:1000;height:82px;background:var(--dark);'
              )
              text = text.replace(
                  '.header{\n  height:82px;',
                  '.header{\n  position:relative;\n  z-index:1000;\n  height:82px;'
              )
              text = text.replace(
                  '.header{height:78px}',
                  '.header{position:relative;z-index:1000;height:78px}'
              )
              text = text.replace(
                  '.header .navigation{position:absolute;',
                  '.header .navigation{position:absolute;z-index:1100;'
              )
              text = text.replace(
                  '.navigation{\n    position:absolute;',
                  '.navigation{\n    position:absolute;\n    z-index:1100;'
              )
              text = text.replace(
                  '.navigation{position:absolute;',
                  '.navigation{position:absolute;z-index:1100;'
              )

              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-properties.mjs imovel.html imoveis
          git diff --cached --quiet || git commit -m "fix: menu mobile sobrepor conteudo [skip mobile fix]"
          git push

      - name: Remove temporary workflow
        if: ${{ success() }}
        run: |
          git rm .github/workflows/fix-mobile-menu.yml
          git commit -m "chore: remover workflow temporario [skip mobile fix]"
          git push
