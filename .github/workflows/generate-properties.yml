name: Gerar páginas dos imóveis

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Normalizar painel de imóveis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("painel.html")
          text = path.read_text(encoding="utf-8")
          original = text

          # Remove duplicações introduzidas pelo antigo workflow.
          text = re.sub(r'(autoSlug=true;\s*){2,}', 'autoSlug=true;\n', text)
          text = re.sub(r'(autoSlug=false;\s*){2,}', 'autoSlug=false;\n', text)

          # Corrige o pequeno erro de markup no campo do endereço.
          text = text.replace('\\small style="display:block;margin-top:7px;color:#6b7280">', '<small style="display:block;margin-top:7px;color:#6b7280">')

          # O preview deve apontar para o mesmo caminho real das páginas geradas.
          text = text.replace("jotorresfnai.github.io/imovel/'+(slug||'...')", "jotorresfnai.github.io/imoveis/'+(slug||'...')")

          # Garante que os quatro campos de área fazem parte do payload guardado.
          required = [
              "area:Number($('area').value)||null,",
              "area_util:Number($('area_util').value)||null,",
              "area_bruta:Number($('area_bruta').value)||null,",
              "area_terreno:Number($('area_terreno').value)||null,",
          ]
          if not all(x in text for x in required):
              raise SystemExit("O painel não contém todos os campos de área no payload.")

          # O slug nunca deve depender de preenchimento manual.
          if "slug:slugify($('slug').value.trim() || $('titulo').value.trim()) || null" not in text:
              raise SystemExit("O painel não contém fallback automático do slug.")

          if text != original:
              path.write_text(text, encoding="utf-8")
              print("Painel normalizado.")
          else:
              print("Painel já estava normalizado.")
          PY

      - name: Guardar normalização do painel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add painel.html
          if git diff --cached --quiet; then
            echo "Sem alterações no painel."
          else
            git commit -m "Normalize property panel fields and slug"
            git push
          fi

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar geradores
        run: |
          test -f scripts/generate-properties.mjs
          test -f scripts/add-gallery-slideshow.mjs
          node --check scripts/generate-properties.mjs
          node --check scripts/add-gallery-slideshow.mjs

      - name: Gerar páginas dos imóveis
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node scripts/generate-properties.mjs
          node scripts/add-gallery-slideshow.mjs

      - name: Validar páginas geradas
        run: |
          test -f sitemap.xml
          test -f imoveis.html
          echo "Páginas geradas:"
          find imoveis -mindepth 2 -maxdepth 2 -name index.html | sort

      - name: Corrigir fundo das miniaturas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path("imoveis").glob("*/index.html"):
              html = path.read_text(encoding="utf-8")
              html = re.sub(r'(\.gallery-thumbs-wrap\s*\{.*?background:)#07171b(;.*?\})', r'\1#ffffff\2', html, flags=re.S)
              html = re.sub(r'(\.gallery-thumb\s*\{.*?background:)#172126(;.*?\})', r'\1#ffffff\2', html, flags=re.S)
              path.write_text(html, encoding="utf-8")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
