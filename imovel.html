<script>

'use strict';


/* =========================================================
   SUPABASE
========================================================= */

const URL_API =
'https://scmorocdbdyvnxodpwyi.supabase.co';

const KEY =
'sb_publishable_W28Qdq8POfYXjCu3BwUxPQ_2z2o2GcM';


/* =========================================================
   ID
========================================================= */

const ID =
new URLSearchParams(
  location.search
).get('id');


const APP =
document.getElementById('app');


/* =========================================================
   ESCAPE
========================================================= */

const esc =
v =>
String(v ?? '')
.replace(
  /[&<>"']/g,
  c =>
  ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[c])
);


/* =========================================================
   PREÇO
========================================================= */

const money =
v =>
v == null || v === ''
?
'Preço sob consulta'
:
new Intl.NumberFormat(
  'pt-PT',
  {
    style:'currency',
    currency:'EUR',
    maximumFractionDigits:0
  }
).format(
  Number(v)
);


/* =========================================================
   IMAGEM
========================================================= */

const img =
p =>
p?.url ||
p?.storage_path
?
(
  p.url ||
  URL_API +
  '/storage/v1/object/public/imoveis/' +
  String(
    p.storage_path
  )
  .split('/')
  .map(
    encodeURIComponent
  )
  .join('/')
)
:
'';


/* =========================================================
   API
========================================================= */

async function api(
  table,
  query
){

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => controller.abort(),
      7000
    );

  try{

    const response =
      await fetch(
        URL_API +
        '/rest/v1/' +
        table +
        '?' +
        query,
        {
          method:'GET',

          cache:'no-store',

          headers:{
            apikey:KEY,
            Authorization:
              'Bearer ' + KEY,
            Accept:
              'application/json'
          },

          signal:controller.signal
        }
      );


    if(!response.ok){

      throw new Error(
        'Supabase HTTP ' +
        response.status
      );

    }


    return await response.json();

  }finally{

    clearTimeout(timeout);

  }

}


/* =========================================================
   META
========================================================= */

function setMeta(
  id,
  value,
  attribute='content'
){

  const element =
    document.getElementById(id);

  if(element){

    element.setAttribute(
      attribute,
      value
    );

  }

}


/* =========================================================
   SEO
========================================================= */

function seo(
  property,
  title,
  location,
  description,
  image
){

  const canonical =
    'https://jotorresfnai.github.io/imovel.html?id=' +
    encodeURIComponent(property.id);


  const desc =
    (
      description ||
      title +
      (
        location
        ?
        ' em ' + location
        :
        ''
      ) +
      ' — imóvel disponível através de Jo Torres.'
    )
    .replace(
      /\s+/g,
      ' '
    )
    .trim()
    .slice(
      0,
      155
    );


  const seoTitle =
    (
      property.seo_titulo ||
      title +
      (
        location
        ?
        ' em ' + location
        :
        ''
      )
    ) +
    ' | Jo Torres';


  document.title =
    seoTitle;


  const descriptionMeta =
    document.querySelector(
      'meta[name="description"]'
    );


  if(descriptionMeta){

    descriptionMeta.content =
      desc;

  }


  setMeta(
    'canonical',
    canonical,
    'href'
  );

  setMeta(
    'ogUrl',
    canonical
  );

  setMeta(
    'ogTitle',
    seoTitle
  );

  setMeta(
    'ogDescription',
    desc
  );

  setMeta(
    'ogImage',
    image ||
    'https://jotorresfnai.github.io/og-imovel.jpg'
  );

  setMeta(
    'twitterTitle',
    seoTitle
  );

  setMeta(
    'twitterDescription',
    desc
  );

  setMeta(
    'twitterImage',
    image ||
    'https://jotorresfnai.github.io/og-imovel.jpg'
  );

}


/* =========================================================
   RENDER
========================================================= */

function render(
  property,
  photos
){

  const rows =
    (photos || [])
    .filter(
      photo =>
        photo.url ||
        photo.storage_path
    );


  if(
    !rows.length &&
    property.imagem_capa
  ){

    rows.push({
      url:property.imagem_capa
    });

  }


  const title =
    property.titulo ||
    'Imóvel';


  const address =
    property.endereco ||
    '';


  const location =
    property.localizacao ||
    '';


  const description =
    property.descricao ||
    '';


  const energy =
    String(
      property.categoria_energetica ||
      ''
    ).trim();


  const mainImage =
    rows.length
    ?
    img(rows[0])
    :
    '';


  seo(
    property,
    title,
    location || address,
    description,
    mainImage
  );


  /* =======================================================
     SLIDES
  ======================================================= */

  const slides =
    rows.length

    ?

    rows
    .map(
      (photo,index) =>

      '<div class="slide ' +
      (
        index === 0
        ?
        'active'
        :
        ''
      ) +
      '">' +

      '<img ' +

      'class="property-image" ' +

      'src="' +
      esc(img(photo)) +
      '" ' +

      'alt="' +
      esc(
        title +
        ' — fotografia ' +
        (index + 1)
      ) +
      '" ' +

      'loading="' +
      (
        index
        ?
        'lazy'
        :
        'eager'
      ) +
      '" ' +

      'decoding="async" ' +

      'onerror="this.classList.add(\'broken\')" ' +

      '>' +

      '</div>'

    )
    .join('')

    :

    '<div style="' +
    'height:100%;' +
    'display:grid;' +
    'place-items:center;' +
    'color:#687277' +
    '">' +

    'Sem fotografias disponíveis.' +

    '</div>';


  /* =======================================================
     DOTS
  ======================================================= */

  const dots =
    rows
    .map(
      (_,index) =>

      '<button ' +

      'class="dot ' +
      (
        index === 0
        ?
        'active'
        :
        ''
      ) +
      '" ' +

      'data-i="' +
      index +
      '" ' +

      'aria-label="Fotografia ' +
      (index + 1) +

/* =========================================================
   SLIDESHOW
========================================================= */

function initGallery(numberOfSlides){

  if(numberOfSlides < 2){

    return;

  }


  const slides =
    [
      ...document.querySelectorAll(
        '.slide'
      )
    ];


  const dots =
    [
      ...document.querySelectorAll(
        '.dot'
      )
    ];


  const thumbs =
    [
      ...document.querySelectorAll(
        '.gallery-thumb'
      )
    ];


  let current = 0;

  let timer = null;


  function show(index){

    current =
      (
        index +
        numberOfSlides
      ) %
      numberOfSlides;


    slides.forEach(
      (slide,index) => {

        slide.classList.toggle(
          'active',
          index === current
        );

      }
    );


    dots.forEach(
      (dot,index) => {

        dot.classList.toggle(
          'active',
          index === current
        );

      }
    );


    thumbs.forEach(
      (thumb,index) => {

        thumb.classList.toggle(
          'active',
          index === current
        );

      }
    );

  }


  function restart(){

    if(timer){

      clearInterval(timer);

    }


    timer =
      setInterval(
        () => {

          show(
            current + 1
          );

        },
        5000
      );

  }


  const prev =
    document.getElementById(
      'prev'
    );


  const next =
    document.getElementById(
      'next'
    );


  if(prev){

    prev.onclick =
    () => {

      show(
        current - 1
      );

      restart();

    };

  }


  if(next){

    next.onclick =
    () => {

      show(
        current + 1
      );

      restart();

    };

  }


  dots.forEach(
    dot => {

      dot.onclick =
      () => {

        show(
          Number(
            dot.dataset.i
          )
        );

        restart();

      };

    }
  );


  thumbs.forEach(
    thumb => {

      thumb.onclick =
      () => {

        show(
          Number(
            thumb.dataset.thumb
          )
        );

        restart();

      };

    }
  );


  restart();

}


/* =========================================================
   CARREGAR IMÓVEL
========================================================= */

async function load(){

  if(!ID){

    APP.className =
      'error';


    APP.innerHTML =

      '<h1>' +
      'Imóvel não especificado' +
      '</h1>' +

      '<p>' +
      'Falta o ID do imóvel no endereço.' +
      '</p>';

    return;

  }


  try{

    const result =
      await Promise.allSettled([

        api(
          'imoveis',
          'select=*&id=eq.' +
          encodeURIComponent(ID) +
          '&limit=1'
        ),

        api(
          'imovel_fotos',
          'select=*&imovel_id=eq.' +
          encodeURIComponent(ID) +
          '&order=ordem.asc'
        )

      ]);


    if(
      result[0].status ===
      'rejected'
    ){

      throw result[0].reason;

    }


    const properties =
      result[0].value;


    if(
      !properties.length
    ){

      throw new Error(
        'Imóvel não encontrado.'
      );

    }


    const photos =
      result[1].status ===
      'fulfilled'
      ?
      result[1].value
      :
      [];


    render(
      properties[0],
      photos
    );


  }catch(error){

    console.error(
      'Erro ao carregar imóvel:',
      error
    );


    APP.className =
      'error';


    APP.innerHTML =

      '<h1>' +
      'Não foi possível carregar o imóvel' +
      '</h1>' +

      '<p>' +
      esc(
        error.message ||
        'Erro desconhecido'
      ) +
      '</p>' +

      '<p>' +

      '<a ' +
      'class="contact-btn" ' +
      'href="imoveis.html">' +

      'Voltar aos imóveis' +

      '</a>' +

      '</p>';

  }

}

<script>
(function(){
  const toggle=document.querySelector('.mobile-menu-toggle');
  const nav=document.querySelector('.header .navigation');
  if(!toggle||!nav)return;
  const setOpen=open=>{nav.classList.toggle('mobile-open',open);toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'Fechar menu':'Abrir menu');const i=toggle.querySelector('i');if(i)i.className=open?'fa-solid fa-xmark':'fa-solid fa-bars';};
  toggle.addEventListener('click',()=>setOpen(!nav.classList.contains('mobile-open')));
  nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>setOpen(false)));
  document.addEventListener('click',e=>{if(nav.classList.contains('mobile-open')&&!nav.contains(e.target)&&!toggle.contains(e.target))setOpen(false)});
  window.addEventListener('resize',()=>{if(window.innerWidth>760)setOpen(false)});
})();
</script>
