name: Repair panel automatic slug

on:
  push:
    paths:
      - 'painel.html'
      - '.github/workflows/repair-panel-slug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair painel.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('painel.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # State used by the title -> slug automation.
          if 'let autoSlug=true;' not in text:
              marker = "function slugify(text){"
              if marker not in text:
                  raise SystemExit('Não encontrei slugify().')
              text = text.replace(marker, "let autoSlug=true;\n" + marker, 1)

          # New property: slug follows the title and publication is enabled by default.
          text = re.sub(
              r"function openNew\(\)\{\s*",
              "function openNew(){\n\nautoSlug=true;\n\n",
              text,
              count=1,
          )
          text = text.replace(
              "$('propertyId').value='';\n\n$('modalTitle').textContent=",
              "$('propertyId').value='';\n\n$('publicado').checked=true;\n\n$('modalTitle').textContent=",
              1,
          )

          # Editing an existing property must not unexpectedly overwrite its slug.
          text = re.sub(
              r"async function editProperty\(id\)\{\s*",
              "async function editProperty(id){\n\nautoSlug=false;\n\n",
              text,
              count=1,
          )

          # Always show a slug when an old record has an empty slug.
          text = text.replace(
              "$('slug').value=p.slug || '';",
              "$('slug').value=p.slug || slugify(p.titulo || '');",
              1,
          )

          # Replace any previous title/slug SEO listeners with one deterministic handler.
          pattern = re.compile(
              r"\['titulo','localizacao','seo_titulo','seo_descricao','slug'\]\.forEach\(id=>\$\(id\)\.addEventListener\('input',\(\)=>\{.*?\}\)\);",
              re.S,
          )
          replacement = """$('titulo').addEventListener('input',()=>{
            if(autoSlug) $('slug').value=slugify($('titulo').value);
            if(!$('seo_titulo').value.trim()) $('seo_titulo').value=$('titulo').value.trim() ? $('titulo').value.trim()+' | Jo Torres Imobiliário' : '';
            updateSeoPreview();
          });

          $('slug').addEventListener('input',()=>{
            autoSlug=false;
            updateSeoPreview();
          });

          ['localizacao','seo_titulo','seo_descricao'].forEach(id=>$(id).addEventListener('input',updateSeoPreview));"""

          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              if "$('titulo').addEventListener('input',()=>{" not in text:
                  raise SystemExit('Não encontrei o listener atual de slug.')

          # Corrige a estrutura dos campos de áreas. Na versão anterior os três
          # campos ficaram aninhados dentro do campo Área, o que fazia o formulário
          # de edição aparecer partido/ocultar campos dependendo do navegador.
          area_pattern = re.compile(
              r"<div>\s*<label>\s*Área \(m²\)\s*</label>\s*<input\s+id=\"area\"\s+type=\"number\"\s+min=\"0\"\s+step=\"0\.01\"\s*>.*?</div>\s*\n\s*<div>\s*\n\s*<label>\s*Quartos",
              re.S,
          )
          area_replacement = '''<div>

<label>
Área (m²)
</label>

<input
id="area"
type="number"
min="0"
step="0.01"
>

</div>


<div>

<label>
Área útil (m²)
</label>

<input
id="area_util"
type="number"
min="0"
step="0.01"
placeholder="Ex.: 180"
>

</div>


<div>

<label>
Área Bruta (m²)
</label>

<input
id="area_bruta"
type="number"
min="0"
step="0.01"
placeholder="Ex.: 220"
>

</div>


<div>

<label>
Área do terreno (m²)
</label>

<input
id="area_terreno"
type="number"
min="0"
step="0.01"
placeholder="Ex.: 750"
>

</div>


<div>

<label>
Quartos'''
          text, area_count = area_pattern.subn(area_replacement, text, count=1)
          if area_count == 0 and 'id="area_util"' not in text:
              raise SystemExit('Não encontrei o bloco dos campos de área.')

          # O script da biblioteca Supabase não deve conter JavaScript próprio dentro
          # do mesmo <script src="...">; esse código pertence a um script separado.
          bad_script = '''<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
(function(){'''
          if bad_script in text:
              text = text.replace(
                  bad_script,
                  '''<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function(){''',
                  1,
              )

          if text == original:
              print('painel.html já estava corrigido.')
              raise SystemExit(0)

          path.write_text(text, encoding='utf-8')
          print('painel.html corrigido.')
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add painel.html
          if git diff --cached --quiet; then
            echo 'Sem alterações.'
            exit 0
          fi
          git commit -m 'Fix property area fields and persistent slug behavior'
          git push
