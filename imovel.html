async function load(){if(!slug){showError('Imóvel não especificado','Falta o slug do imóvel no endereço.');return}const r=await sb.from('imoveis').select('*').eq('slug',slug).eq('publicado',true).limit(1);if(r.error||!r.data?.length){showError('Imóvel não encontrado',r.error?.message||'O imóvel não está disponível.');return}const p=r.data[0];const f=await sb.from('imovel_fotos').select('*').eq('imovel_id',p.id).order('ordem',{ascending:true});render(p,f.data||[])}

function initGallery(rows){let i=0;const main=document.getElementById('mainImage');const thumbs=[...document.querySelectorAll('.thumb')];const show=n=>{i=(n+rows.length)%rows.length;main.src=rows[i].url;thumbs.forEach((b,k)=>b.classList.toggle('active',k===i))};document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);thumbs.forEach(b=>b.onclick=()=>show(Number(b.dataset.i)))}

<script id="jo-gallery-thumbnails-restore-v3-js">
(function(){
  function moveThumbs(){
    const app=document.getElementById('app');
    if(!app)return;
    const gallery=app.querySelector('.gallery');
    const thumbs=gallery?.querySelector('.thumbs');
    if(!gallery||!thumbs)return;
    if(thumbs.dataset.moved==='1')return;
    let wrap=app.querySelector('.jo-gallery-wrap');
    if(!wrap){
      wrap=document.createElement('div');
      wrap.className='jo-gallery-wrap';
      gallery.parentNode.insertBefore(wrap,gallery);
      wrap.appendChild(gallery);
    }
    thumbs.classList.add('jo-thumbs-out');
    wrap.appendChild(thumbs);
    thumbs.dataset.moved='1';
  }
  function watch(){
    const app=document.getElementById('app');
    if(!app)return;
    moveThumbs();
    const observer=new MutationObserver(function(){moveThumbs();});
    observer.observe(app,{childList:true,subtree:true});
    setTimeout(moveThumbs,100);
    setTimeout(moveThumbs,500);
    setTimeout(moveThumbs,1500);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',watch);else watch();
})();
</script>
