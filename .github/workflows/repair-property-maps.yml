name: Repair property maps

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair generated property maps
        run: node scripts/repair-property-maps.mjs
      - name: Commit repaired pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imoveis
          if git diff --cached --quiet; then
            echo 'No property map changes needed.'
            exit 0
          fi
          git commit -m 'Restore property maps'
          git push
