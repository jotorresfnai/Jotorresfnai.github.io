name: Fix panel slug and publication

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch painel.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('painel.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # New properties start with automatic slug generation and publication enabled.
          if "function openNew(){" in text and "$('publicado').checked=true;" not in text:
              text = text.replace(
                  "function openNew(){\n\n$('propertyForm').reset();",
                  "function openNew(){\n\nautoSlug=true;\n\n$('propertyForm').reset();",
                  1
              )
              text = text.replace(
                  "$('propertyId').value='';\n\n$('modalTitle').textContent=",
                  "$('propertyId').value='';\n\n$('publicado').checked=true;\n\n$('modalTitle').textContent=",
                  1
              )

          # Existing properties keep their stored slug unless the user edits it.
          text = text.replace(
              "async function editProperty(id){\n\nconst result =",
              "async function editProperty(id){\n\nautoSlug=false;\n\nconst result =",
              1
          )

          # Replace the old slug listener with a deterministic title -> slug handler.
          pattern = re.compile(r"\['titulo','localizacao','seo_titulo','seo_descricao','slug'\]\.forEach\(id=>\$\(id\)\.addEventListener\('input',\(\)=>\{.*?\}\)\);", re.S)
          replacement = """let autoSlug=true;

$('titulo').addEventListener('input',()=>{
  if(autoSlug) $('slug').value=slugify($('titulo').value);
  if(!$('seo_titulo').value.trim()) $('seo_titulo').value=$('titulo').value.trim() ? $('titulo').value.trim()+' | Jo Torres Imobiliário' : '';
  updateSeoPreview();
});

$('slug').addEventListener('input',()=>{
  autoSlug=false;
  updateSeoPreview();
});

['localizacao','seo_titulo','seo_descricao'].forEach(id=>$(id).addEventListener('input',updateSeoPreview));"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Não encontrei o listener de slug do painel.')

          if text == original:
              raise SystemExit('O painel já estava corrigido ou não foi possível aplicar alterações.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add painel.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix automatic property slug and publish default"
          git push