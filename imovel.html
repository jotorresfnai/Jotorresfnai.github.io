<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
'https://scmorocdbdyvnxodpwyi.supabase.co';

const SUPABASE_KEY =
'sb_publishable_W28Qdq8POfYXjCu3BwUxPQ_2z2o2GcM';

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   ELEMENTOS
========================================================= */

const app =
document.getElementById('app');


/* =========================================================
   MENU MOBILE
========================================================= */

document
  .getElementById('menuToggle')
  .addEventListener('click',()=>{

    const n =
    document.getElementById('navigation');

    const b =
    document.getElementById('menuToggle');

    const open =
    n.classList.toggle('mobile-open');

    b.setAttribute(
      'aria-expanded',
      open ? 'true' : 'false'
    );

  });


/* =========================================================
   SEGURANÇA
========================================================= */

function esc(v){

  return String(v ?? '')
    .replace(
      /[&<>"']/g,
      c=>({

        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'

      }[c])
    );

}


/* =========================================================
   IDENTIFICAR IMÓVEL
=========================================================

   Aceita:

   1. /imovel.html?id=123

   2. /imoveis/quinta-t8-deocriste/

   Assim as URLs novas não são alteradas.
========================================================= */

function getPropertyReference(){

  const params =
  new URLSearchParams(
    window.location.search
  );

  const queryId =
  params.get('id');

  if(queryId){

    return {
      type:'id',
      value:queryId
    };

  }


  const pathname =
  window.location.pathname
    .replace(/^\/+|\/+$/g,'');

  const parts =
  pathname.split('/');


  /*
    Exemplo:

    imoveis/quinta-t8-deocriste

    slug = quinta-t8-deocriste
  */

  if(
    parts.length >= 2 &&
    parts[0].toLowerCase() === 'imoveis'
  ){

    const slug =
    decodeURIComponent(
      parts[parts.length - 1]
    );

    if(slug){

      return {
        type:'slug',
        value:slug
      };

    }

  }


  return null;

}


/* =========================================================
   ID / SLUG
========================================================= */

const propertyReference =
getPropertyReference();


/* =========================================================
   URL DA IMAGEM SUPABASE
========================================================= */

function publicUrl(path){

  if(!path){

    return '';

  }

  return sb.storage
    .from('imoveis')
    .getPublicUrl(path)
    .data.publicUrl;

}


/* =========================================================
   CANDIDATOS DE IMAGEM
========================================================= */

function candidates(photo){

  const a=[];


  if(photo?.url){

    a.push(
      photo.url
    );

  }


  if(photo?.storage_path){

    a.push(
      publicUrl(
        photo.storage_path
      )
    );

  }


  return [
    ...new Set(
      a.filter(Boolean)
    )
  ];

}


/* =========================================================
   HTML DA IMAGEM
========================================================= */

function imageHtml(
  photo,
  i,
  title
){

  const srcs =
  candidates(photo);

  return `

<img
  class="property-image"
  data-sources="${esc(
    JSON.stringify(srcs)
  )}"
  data-source-index="0"
  src="${esc(
    srcs[0] || ''
  )}"
  alt="${esc(title)} — fotografia ${i+1}"
  loading="${i ? 'lazy' : 'eager'}"
  decoding="async"
  onerror="tryNextImage(this)"
>

`;

}


/* =========================================================
   FALLBACK DE IMAGENS
========================================================= */

function tryNextImage(img){

  let sources=[];

  try{

    sources =
    JSON.parse(
      img.dataset.sources || '[]'
    );

  }catch(e){}


  const next =
  Number(
    img.dataset.sourceIndex || 0
  ) + 1;


  if(
    next < sources.length
  ){

    img.dataset.sourceIndex =
    next;

    img.src =
    sources[next];

    return;

  }


  img.classList.add(
    'broken'
  );

  img.removeAttribute(
    'onerror'
  );

}


/* =========================================================
   MAPA
========================================================= */

function mapUrl(address){

  if(!address){

    return '';

  }


  /*
    Google Maps em modo embed.

    Mantemos a pesquisa pelo endereço para
    não depender de uma API key.
  */

  return (
    'https://www.google.com/maps?q='
    +
    encodeURIComponent(address)
    +
    '&z=16'
    +
    '&output=embed'
  );

}


/* =========================================================
   LINK GOOGLE MAPS
========================================================= */

function googleMapsLink(address){

  if(!address){

    return '#';

  }


  return (
    'https://www.google.com/maps/search/?api=1&query='
    +
    encodeURIComponent(address)
  );

}


/* =========================================================
   PREÇO
========================================================= */

function money(v){

  if(
    v == null ||
    v === ''
  ){

    return 'Preço sob consulta';

  }


  const n =
  Number(v);


  if(
    Number.isNaN(n)
  ){

    return 'Preço sob consulta';

  }


  return new Intl.NumberFormat(
    'pt-PT',
    {
      style:'currency',
      currency:'EUR',
      maximumFractionDigits:0
    }
  ).format(n);

}


/* =========================================================
   NÚMEROS
========================================================= */

function safeNum(
  v,
  empty='—'
){

  return (
    v == null ||
    v === ''
  )
  ?
  empty
  :
  v;

}


/* =========================================================
   ENERGIA
========================================================= */

function energyHtml(e){

  const x =
  String(e || '').trim();


  if(!x){

    return '';

  }


  return `

<section
  class="energy-section"
>

<div class="energy-label">
Categoria Energética
</div>

<div class="energy-symbol">
${esc(x)}
</div>

</section>

`;

}


/* =========================================================
   SEO
========================================================= */

function updateSEO(
  p,
  title,
  location,
  description,
  image
){

  /*
    IMPORTANTE:

    Se o imóvel tem slug, a canonical passa a ser
    a URL nova /imoveis/slug/

    Não volta para imovel.html?id=...
  */

  let canonicalUrl =
    'https://jotorresfnai.github.io/imovel.html';


  if(p.slug){

    canonicalUrl =
      'https://jotorresfnai.github.io/imoveis/'
      +
      encodeURIComponent(
        p.slug
      )
      +
      '/';

  }
  else if(p.id){

    canonicalUrl +=
      '?id=' +
      encodeURIComponent(
        p.id
      );

  }


  const cleanDescription =
    description
    ?
    String(description)
      .replace(/\s+/g,' ')
      .trim()
      .substring(0,155)
    :
    (
      title
      +
      (
        location
        ?
        ' em ' + location
        :
        ''
      )
      +
      ' — imóvel disponível através de Jo Torres.'
    );


  const seoTitle =
    (
      p.seo_titulo
      ||
      title
      +
      (
        location
        ?
        ' em ' + location
        :
        ''
      )
    )
    +
    ' | Jo Torres';


  document.title =
    seoTitle;


  /* DESCRIPTION */

  let descriptionTag =
    document.querySelector(
      'meta[name="description"]'
    );


  if(!descriptionTag){

    descriptionTag =
      document.createElement(
        'meta'
      );

    descriptionTag.name =
      'description';

    document.head.appendChild(
      descriptionTag
    );

  }


  descriptionTag.content =
    cleanDescription;


  /* CANONICAL */

  const canonical =
    document.getElementById(
      'canonical'
    );


  if(canonical){

    canonical.href =
      canonicalUrl;

  }


  /* OG URL */

  const ogUrl =
    document.getElementById(
      'ogUrl'
    );


  if(ogUrl){

    ogUrl.content =
      canonicalUrl;

  }


  /* OG TITLE */

  const ogTitle =
    document.getElementById(
      'ogTitle'
    );


  if(ogTitle){

    ogTitle.content =
      seoTitle;

  }


  /* OG DESCRIPTION */

  const ogDescription =
    document.getElementById(
      'ogDescription'
    );


  if(ogDescription){

    ogDescription.content =
      cleanDescription;

  }


  /* OG IMAGE */

  const ogImage =
    document.getElementById(
      'ogImage'
    );


  if(
    ogImage &&
    image
  ){

    ogImage.content =
      image;

  }


  /* TWITTER TITLE */

  const twitterTitle =
    document.getElementById(
      'twitterTitle'
    );


  if(twitterTitle){

    twitterTitle.content =
      seoTitle;

  }


  /* TWITTER DESCRIPTION */

  const twitterDescription =
    document.getElementById(
      'twitterDescription'
    );


  if(twitterDescription){

    twitterDescription.content =
      cleanDescription;

  }


  /* TWITTER IMAGE */

  const twitterImage =
    document.getElementById(
      'twitterImage'
    );


  if(
    twitterImage &&
    image
  ){

    twitterImage.content =
      image;

  }


  /* =====================================================
     DADOS ESTRUTURADOS
  ===================================================== */

  const oldSchema =
    document.getElementById(
      'propertySchema'
    );


  if(oldSchema){

    oldSchema.remove();

  }


  const schema =
    document.createElement(
      'script'
    );


  schema.type =
    'application/ld+json';

  schema.id =
    'propertySchema';


  const schemaData = {

    "@context":
      "https://schema.org",

    "@type":
      "RealEstateListing",

    "name":
      title,

    "url":
      canonicalUrl,

    "description":
      cleanDescription,

    "image":
      image
      ?
      [image]
      :
      [],

    "inLanguage":
      "pt-PT",

    "provider":{

      "@type":
        "Person",

      "name":
        "Jo Torres",

      "jobTitle":
        "Consultor Imobiliário",

      "url":
        "https://jotorresfnai.github.io/"

    }

  };


  if(location){

    schemaData.address = {

      "@type":
        "PostalAddress",

      "addressLocality":
        location,

      "addressCountry":
        "PT"

    };

  }


  if(
    p.preco !== null &&
    p.preco !== undefined &&
    p.preco !== ''
  ){

    schemaData.offers = {

      "@type":
        "Offer",

      "price":
        Number(p.preco),

      "priceCurrency":
        "EUR",

      "availability":
        "https://schema.org/InStock",

      "url":
        canonicalUrl

    };

  }


  if(
    p.area !== null &&
    p.area !== undefined &&
    p.area !== ''
  ){

    schemaData.floorSize = {

      "@type":
        "QuantitativeValue",

      "value":
        Number(p.area),

      "unitCode":
        "MTK"

    };

  }


  if(
    p.quartos !== null &&
    p.quartos !== undefined &&
    p.quartos !== ''
  ){

    schemaData.numberOfRooms =
      Number(p.quartos);

  }


  schema.textContent =
    JSON.stringify(
      schemaData
    );


  document.head.appendChild(
    schema
  );

}


/* =========================================================
   CARREGAR IMÓVEL
========================================================= */

async function load(){

  /* =====================================================
     SEM ID NEM SLUG
  ===================================================== */

  if(!propertyReference){

    app.className =
      'error';

    app.innerHTML = `

<h1>
Imóvel não especificado
</h1>

<p>
Não foi possível identificar o imóvel neste endereço.
</p>

<a
  href="/imoveis.html"
  class="contact-btn"
  style="margin-top:20px;"
>
Voltar aos imóveis
</a>

`;

    return;

  }


  /* =====================================================
     BUSCAR IMÓVEL
  ===================================================== */

  let propertyQuery;


  if(
    propertyReference.type === 'slug'
  ){

    /*
      URL nova:

      /imoveis/quinta-t8-deocriste/

      Procura diretamente pelo slug.
    */

    propertyQuery =
      sb
        .from('imoveis')
        .select('*')
        .eq(
          'slug',
          propertyReference.value
        )
        .maybeSingle();

  }
  else{

    /*
      Compatibilidade com URLs antigas:

      /imovel.html?id=...
    */

    propertyQuery =
      sb
        .from('imoveis')
        .select('*')
        .eq(
          'id',
          propertyReference.value
        )
        .maybeSingle();

  }


  const {
    data:p,
    error
  } =
    await propertyQuery;


  /* =====================================================
     ERRO
  ===================================================== */

  if(
    error ||
    !p
  ){

    console.error(
      'Erro ao carregar imóvel:',
      error
    );


    app.className =
      'error';

    app.innerHTML = `

<h1>
Imóvel não encontrado
</h1>

<p>
Não foi possível carregar o imóvel selecionado.
</p>

<a
  href="/imoveis.html"
  class="contact-btn"
  style="margin-top:20px;"
>
Voltar aos imóveis
</a>

`;

    return;

  }


  /* =====================================================
     BUSCAR FOTOGRAFIAS
  ===================================================== */

  const {
    data:photos,
    error:photoError
  } =
    await sb
      .from('imovel_fotos')
      .select('*')
      .eq(
        'imovel_id',
        p.id
      )
      .order(
        'ordem',
        {
          ascending:true
        }
      );


  if(photoError){

    console.warn(
      'Erro nas fotografias:',
      photoError
    );

  }


  const rows =
    (photos || [])
      .filter(
        x =>
          x.url ||
          x.storage_path
      );


  /* FOTO DE CAPA */

  if(
    !rows.length &&
    p.imagem_capa
  ){

    rows.push({

      url:
        p.imagem_capa,

      storage_path:
        null,

      ordem:
        0

    });

  }


  /* =====================================================
     DADOS
  ===================================================== */

  const title =
    p.titulo ||
    'Imóvel';


  const address =
    p.endereco ||
    '';


  const loc =
    p.localizacao ||
    '';


  const energy =
    String(
      p.categoria_energetica ||
      ''
    ).trim();


  const description =
    p.descricao ||
    '';


  /* =====================================================
     IMAGEM PRINCIPAL
  ===================================================== */

  let mainImage =
    '';


  if(rows.length){

    const firstSources =
      candidates(
        rows[0]
      );


    mainImage =
      firstSources[0] ||
      '';

  }


  if(
    !mainImage &&
    p.imagem_capa
  ){

    mainImage =
      p.imagem_capa;

  }


  /* =====================================================
     SEO
  ===================================================== */

  updateSEO(
    p,
    title,
    loc || address,
    description,
    mainImage
  );


  /* =====================================================
     GALERIA
  ===================================================== */

  const slides =
    rows
      .map(
        (photo,i)=>

        `<div
          class="slide ${i===0?'active':''}"
          data-index="${i}"
        >
          ${imageHtml(
            photo,
            i,
            title
          )}
        </div>`

      )
      .join('');


  const dots =
    rows
      .map(
        (_,i)=>

        `<span
          class="dot ${i===0?'active':''}"
          data-i="${i}"
          aria-label="Fotografia ${i+1}"
          role="button"
          tabindex="0"
        ></span>`

      )
      .join('');


  const thumbs =
    rows
      .map(
        (photo,i)=>

        `<div
          class="thumb ${i===0?'active':''}"
          data-i="${i}"
        >
          ${imageHtml(
            photo,
            i,
            title
          )}
        </div>`

      )
      .join('');


  /* =====================================================
     CONTEÚDO
  ===================================================== */

  app.className='';


  app.innerHTML = `

<section
  class="gallery"
  id="gallery"
>

${
  slides ||

  '<div class="map-empty">Sem fotografias disponíveis.</div>'
}


${
  rows.length > 1

  ?

  `
  <button
    class="slide-btn prev"
    id="prev"
    aria-label="Fotografia anterior"
    type="button"
  >

    <i class="fa-solid fa-chevron-left"></i>

  </button>


  <button
    class="slide-btn next"
    id="next"
    aria-label="Fotografia seguinte"
    type="button"
  >

    <i class="fa-solid fa-chevron-right"></i>

  </button>
  `

  :

  ''
}


${
  rows.length > 1

  ?

  `
  <div class="dots">
    ${dots}
  </div>
  `

  :

  ''
}


<div class="fnai-watermark">
FNAI
</div>

</section>


${
  rows.length > 1

  ?

  `<div class="thumbs">
    ${thumbs}
  </div>`

  :

  ''
}


<section
  class="content-grid"
>


<div>


<div class="eyebrow">
${esc(
  p.estado ||
  'Disponível'
)}
</div>


<h1 class="title">
${esc(title)}
</h1>


<div class="location">

<i class="fa-solid fa-location-dot"></i>

${esc(
  loc ||
  address ||
  ''
)}

</div>


<div class="price">
${money(p.preco)}
</div>


<div class="features">


<div class="feature">

<i class="fa-solid fa-bed"></i>

<strong>
${safeNum(
  p.quartos,
  0
)}
</strong>

<span>
Quartos
</span>

</div>


<div class="feature">

<i class="fa-solid fa-bath"></i>

<strong>
${safeNum(
  p.casas_banho,
  0
)}
</strong>

<span>
WC
</span>

</div>


<div class="feature">

<i class="fa-solid fa-ruler-combined"></i>

<strong>
${safeNum(
  p.area,
  0
)}
</strong>

<span>
m²
</span>

</div>


<div class="feature">

<i class="fa-solid fa-car"></i>

<strong>
${p.garagem ? 'Sim' : 'Não'}
</strong>

<span>
Garagem
</span>

</div>


<div class="feature">

<i class="fa-solid fa-person-swimming"></i>

<strong>
${p.piscina ? 'Sim' : 'Não'}
</strong>

<span>
Piscina
</span>

</div>


</div>


<div class="tags">


${
  p.garagem

  ?

  `
  <span class="tag">

    <i class="fa-solid fa-car"></i>

    Garagem

  </span>
  `

  :

  ''
}


${
  p.piscina

  ?

  `
  <span class="tag">

    <i class="fa-solid fa-person-swimming"></i>

    Piscina

  </span>
  `

  :

  ''
}


${
  p.luxo

  ?

  `
  <span class="tag">

    <i class="fa-solid fa-gem"></i>

    Luxo

  </span>
  `

  :

  ''
}


</div>


<section
  class="description"
>

<h2>
Descrição
</h2>

<p>
${esc(description)}
</p>

</section>


${energyHtml(energy)}


${
  address

  ?

  `
  <section
    class="address"
  >

  <h2>
  Morada
  </h2>

  <p>
  ${esc(address)}
  </p>

  </section>
  `

  :

  ''
}


</div>


<aside class="card">


<h2>
${money(p.preco)}
</h2>


<div class="location">

<i class="fa-solid fa-house"></i>

${esc(
  p.tipo ||
  'Imóvel'
)}

</div>


<p
  style="color:#687277;"
>

${esc(loc)}

</p>


<a
  class="contact-btn"
  href="https://wa.me/41792601145?text=${encodeURIComponent(
    'Olá, gostaria de obter informações sobre o imóvel ' +
    title
  )}"
  target="_blank"
  rel="noopener noreferrer"
>

<i class="fa-brands fa-whatsapp"></i>

Pedir informações

</a>


${
  p.fnai_url

  ?

  `
  <a
    class="fnai-link"
    href="${esc(p.fnai_url)}"
    target="_blank"
    rel="noopener noreferrer"
  >

    <i class="fa-solid fa-arrow-up-right-from-square"></i>

    Ver anúncio na FNAI

  </a>
  `

  :

  ''
}


</aside>


</section>


${
  address

  ?

  `
  <section
    class="map-section"
  >

    <h2>
      Localização
    </h2>


    <div class="map">


      <iframe
        id="propertyMap"
        src="${esc(
          mapUrl(address)
        )}"
        loading="eager"
        allow="fullscreen"
        allowfullscreen
        title="Localização do imóvel ${esc(title)}"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>


      <div class="map-fallback">

        <span>
          ${esc(address)}
        </span>


        <a
          href="${esc(
            googleMapsLink(address)
          )}"
          target="_blank"
          rel="noopener noreferrer"
          class="map-open"
        >

          <i class="fa-solid fa-map-location-dot"></i>

          Abrir no Google Maps

        </a>

      </div>


    </div>

  </section>
  `

  :

  ''
}

`;


  /* =====================================================
     GALERIA — CONTROLOS
  ===================================================== */

  let current =
    0;


  const slideEls =
    [
      ...document.querySelectorAll(
        '.slide'
      )
    ];


  const dotEls =
    [
      ...document.querySelectorAll(
        '.dot'
      )
    ];


  const thumbEls =
    [
      ...document.querySelectorAll(
        '.thumb'
      )
    ];


  function show(n){

    if(
      !slideEls.length
    ){

      return;

    }


    current =
      (
        n +
        slideEls.length
      )
      %
      slideEls.length;


    slideEls.forEach(
      (s,i)=>

        s.classList.toggle(
          'active',
          i === current
        )
    );


    dotEls.forEach(
      (d,i)=>

        d.classList.toggle(
          'active',
          i === current
        )
    );


    thumbEls.forEach(
      (t,i)=>

        t.classList.toggle(
          'active',
          i === current
        )
    );

  }


  document
    .getElementById('prev')
    ?.addEventListener(
      'click',
      ()=>show(current-1)
    );


  document
    .getElementById('next')
    ?.addEventListener(
      'click',
      ()=>show(current+1)
    );


  dotEls.forEach(
    d =>

      d.addEventListener(
        'click',
        ()=>show(
          Number(
            d.dataset.i
          )
        )
      )
  );


  thumbEls.forEach(
    t =>

      t.addEventListener(
        'click',
        ()=>show(
          Number(
            t.dataset.i
          )
        )
      )
  );


  /* =====================================================
     MAPA
  ===================================================== */

  const propertyMap =
    document.getElementById(
      'propertyMap'
    );


  if(propertyMap){

    /*
      Garantimos que o iframe recebe novamente
      o endereço depois do DOM estar criado.

      Isto ajuda em alguns browsers móveis.
    */

    const mapSrc =
      mapUrl(address);


    setTimeout(()=>{

      if(
        propertyMap.src !== mapSrc
      ){

        propertyMap.src =
          mapSrc;

      }

    },100);


  }

}


/* =========================================================
   INICIAR
========================================================= */

load();

</script>

</body>

</html>
