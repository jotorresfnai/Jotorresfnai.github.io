name: Gerar páginas dos imóveis

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar scripts
        run: |
          echo "Commit atual:"
          git rev-parse HEAD
          echo "Scripts disponíveis:"
          ls -la scripts
          test -f scripts/generate-properties.mjs
          test -f scripts/add-gallery-slideshow.mjs

      - name: Gerar páginas dos imóveis
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node scripts/generate-properties.mjs
          node scripts/add-gallery-slideshow.mjs

      - name: Corrigir fundo das miniaturas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in Path("imoveis").glob("*/index.html"):
              html = path.read_text(encoding="utf-8")

              html = re.sub(
                  r'(\.gallery-thumbs-wrap\s*\{.*?background:)#07171b(;.*?\})',
                  r'\1#ffffff\2',
                  html,
                  flags=re.S,
              )

              html = re.sub(
                  r'(\.gallery-thumb\s*\{.*?background:)#172126(;.*?\})',
                  r'\1#ffffff\2',
                  html,
                  flags=re.S,
              )

              path.write_text(html, encoding="utf-8")
              print(f"Miniaturas corrigidas: {path}")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
