name: Gerar páginas dos imóveis

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Corrigir painel de gestão
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("painel.html")
          text = path.read_text(encoding="utf-8")

          # Idempotente: depois de corrigido, não tenta aplicar a mesma alteração outra vez.
          if "let autoSlug=true;" not in text:
              text = text.replace(
                  "function openNew(){\n\n$('propertyForm').reset();",
                  "function openNew(){\n\nautoSlug=true;\n\n$('propertyForm').reset();",
                  1,
              )
              text = text.replace(
                  "$('propertyId').value='';\n\n$('modalTitle').textContent=",
                  "$('propertyId').value='';\n\n$('publicado').checked=true;\n\n$('modalTitle').textContent=",
                  1,
              )

              text = text.replace(
                  "async function editProperty(id){\n\nconst result =",
                  "async function editProperty(id){\n\nautoSlug=false;\n\nconst result =",
                  1,
              )

              # O listener antigo termina em })); — há dois parênteses de fecho.
              pattern = re.compile(
                  r"\['titulo','localizacao','seo_titulo','seo_descricao','slug'\]\.forEach\(id=>\$\(id\)\.addEventListener\('input',\(\)=>\{.*?\}\)\);",
                  re.S,
              )
              replacement = """let autoSlug=true;

$('titulo').addEventListener('input',()=>{
  if(autoSlug) $('slug').value=slugify($('titulo').value);
  if(!$('seo_titulo').value.trim()) $('seo_titulo').value=$('titulo').value.trim() ? $('titulo').value.trim()+' | Jo Torres Imobiliário' : '';
  updateSeoPreview();
});

$('slug').addEventListener('input',()=>{
  autoSlug=false;
  updateSeoPreview();
});

['localizacao','seo_titulo','seo_descricao'].forEach(id=>$(id).addEventListener('input',updateSeoPreview));"""
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit("Não encontrei o listener antigo de slug do painel.")

              path.write_text(text, encoding="utf-8")
              print("Painel corrigido.")
          else:
              print("Painel já estava corrigido; sem alterações.")
          PY

      - name: Guardar correção do painel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add painel.html
          if git diff --cached --quiet; then
            echo "Sem alterações no painel."
          else
            git commit -m "Fix automatic property slug and publish default"
            git push
          fi

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar scripts
        run: |
          echo "Commit atual:"
          git rev-parse HEAD
          echo "Scripts disponíveis:"
          ls -la scripts
          test -f scripts/generate-properties.mjs
          test -f scripts/add-gallery-slideshow.mjs

      - name: Gerar páginas dos imóveis
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node scripts/generate-properties.mjs
          node scripts/add-gallery-slideshow.mjs

      - name: Corrigir fundo das miniaturas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in Path("imoveis").glob("*/index.html"):
              html = path.read_text(encoding="utf-8")

              html = re.sub(
                  r'(\.gallery-thumbs-wrap\s*\{.*?background:)#07171b(;.*?\})',
                  r'\1#ffffff\2',
                  html,
                  flags=re.S,
              )

              html = re.sub(
                  r'(\.gallery-thumb\s*\{.*?background:)#172126(;.*?\})',
                  r'\1#ffffff\2',
                  html,
                  flags=re.S,
              )

              path.write_text(html, encoding="utf-8")
              print(f"Miniaturas corrigidas: {path}")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
