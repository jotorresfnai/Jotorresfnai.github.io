name: Fix Quinta T8 HTML

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir apenas HTML inválido da Quinta T8
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('imoveis/quinta-t8-deocriste/index.html')
          if not p.exists():
              raise SystemExit('Página da Quinta T8 ainda não existe; nada para corrigir.')

          s = p.read_text(encoding='utf-8')

          # A versão anterior fazia replace de "div class=..." e podia
          # transformar uma abertura correta em <<div. Corrigir somente
          # as formas realmente inválidas, sem tocar no slideshow/mapa.
          s = s.replace('<<<<div class="main-grid">', '<div class="main-grid">')
          s = s.replace('<<<div class="main-grid">', '<div class="main-grid">')
          s = s.replace('<<div class="main-grid">', '<div class="main-grid">')

          # Remove apenas caracteres '<' soltos imediatamente antes da
          # abertura da grelha principal.
          s = re.sub(r'<{2,}(?=div class="main-grid">)', '', s)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imoveis/quinta-t8-deocriste/index.html
          git diff --cached --quiet || git commit -m "Fix Quinta T8 main grid markup safely"
          git push
