:root{--dark:#07171b;--gold:#c9a34a;--text:#263238;--muted:#687277;--bg:#f5f6f6}*{box-sizing:border-box}html,body{margin:0;padding:0;overflow-x:hidden}body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}a{text-decoration:none;color:inherit}.header{height:82px;background:var(--dark);display:flex;align-items:center;justify-content:space-between;padding:0 5%;color:#fff;position:relative;z-index:100}.logo{display:flex;align-items:center;gap:12px}.logo-circle{width:48px;height:48px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font:700 18px Georgia,serif}.logo-text strong{display:block;letter-spacing:2px;font-size:17px}.logo-text span{display:block;color:#b9c1c3;font-size:10px;letter-spacing:2px}.navigation{display:flex;align-items:center;gap:26px}.navigation a{font-size:14px;color:#fff}.navigation a:hover{color:var(--gold)}.navigation .whatsapp{background:var(--gold);color:var(--dark);padding:10px 15px;border-radius:7px;font-weight:800}.mobile-menu-toggle{display:none;border:0;background:none;color:#fff;font-size:30px;width:46px;height:46px}.page{width:min(1380px,92%);margin:auto;padding:30px 0 80px}.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;margin-bottom:20px}.loading,.error{padding:60px;text-align:center;background:#fff;border-radius:16px}.gallery{position:relative;width:100%;height:min(68vw,700px);min-height:430px;background:#0c191c;border-radius:18px;overflow:hidden;box-shadow:0 15px 45px rgba(0,0,0,.12);touch-action:pan-y;user-select:none}.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .35s ease}.slide.active{opacity:1;visibility:visible}.slide img.property-image{width:100%;height:100%;object-fit:cover;display:block}.fnai-watermark{position:absolute!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;width:100px!important;height:66px!important;object-fit:contain!important;opacity:.8!important;z-index:5!important;pointer-events:none!important}.slide-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:10;width:52px;height:52px;border:0;border-radius:50%;background:rgba(7,23,27,.75);color:#fff;font-size:21px;cursor:pointer}.prev{left:20px}.next{right:20px}.dots{position:absolute;z-index:10;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:8px;padding:8px 12px;border-radius:20px;background:rgba(7,23,27,.38)}.dot{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.55);cursor:pointer}.dot.active{background:var(--gold);transform:scale(1.25)}.content-grid{display:grid;grid-template-columns:minmax(0,1.75fr) 360px;gap:45px;margin-top:45px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:var(--gold);text-transform:uppercase}.title{font:700 clamp(40px,5vw,68px)/1.05 Georgia,serif;color:var(--dark);margin:7px 0 12px}.location{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:17px}.location i,.tag i{color:var(--gold)}.price{font-size:34px;font-weight:900;color:var(--dark);margin:20px 0 28px}.features{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #e0e4e5;border-bottom:1px solid #e0e4e5;padding:20px 0;margin-bottom:32px}.feature{text-align:center;border-right:1px solid #e0e4e5}.feature:last-child{border-right:0}.feature i{display:block;color:var(--gold);font-size:18px;margin-bottom:4px}.feature strong{display:block;font-size:17px;color:var(--dark)}.feature span{font-size:11px;color:var(--muted)}.tags{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 28px}.tag{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #e1e5e6;border-radius:7px;padding:7px 10px;color:#596367;font-size:12px;font-weight:800}.description,.address,.energy-section{margin-top:32px}.description h2,.address h2,.map-section h2{font:700 32px Georgia,serif;color:var(--dark);margin:0 0 12px}.description p,.address p{white-space:pre-line;color:#596367;font-size:16px;margin:0}.card{background:#fff;border-radius:16px;border:1px solid #e4e8e9;padding:25px;box-shadow:0 10px 35px rgba(0,0,0,.06);height:max-content}.card h2{font:700 28px Georgia,serif;color:var(--dark);margin:0 0 18px}.contact-btn{display:flex;justify-content:center;align-items:center;gap:9px;background:var(--dark);color:#fff;border-radius:8px;padding:14px;font-weight:800}.fnai-link{display:flex;justify-content:center;align-items:center;gap:8px;color:#8a6a18;font-weight:800;font-size:13px;margin-top:16px}.energy{border-top:1px solid #e7e9ea;margin-top:22px;padding-top:20px}.energy-label{font-size:13px;color:var(--muted);margin-bottom:9px}.energy-symbol{width:52px;height:52px;background:#69a93e;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900;border-radius:2px}.map-section{margin-top:60px}.map{height:520px;width:100%;border-radius:18px;overflow:hidden;background:#e8ebec;border:1px solid #dfe4e5}.map iframe{display:block;width:100%;height:100%;border:0}.map-open{display:none;margin-top:12px;width:100%;padding:14px 18px;border-radius:8px;background:var(--dark);color:#fff;text-align:center;font-weight:800}.status{font-size:14px;color:var(--muted);margin-top:12px}.status.error-text{color:#a33}
@media(max-width:760px){.header{height:78px}.mobile-menu-toggle{display:grid;place-items:center}.navigation{position:absolute!important;top:100%!important;left:0!important;width:100%!important;display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:0!important;padding:10px 5% 18px!important;background:var(--dark)!important;opacity:0;visibility:hidden;pointer-events:none;box-shadow:0 14px 28px rgba(0,0,0,.25);transition:.18s}.navigation.mobile-open{opacity:1;visibility:visible;pointer-events:auto}.navigation a{padding:15px 5px;border-bottom:1px solid rgba(255,255,255,.1);font-size:18px}.navigation .whatsapp{margin-top:12px;text-align:center}.page{width:92%;padding-top:22px}.gallery{height:65vw;min-height:300px;border-radius:12px}.slide-btn{width:44px;height:44px;font-size:17px}.prev{left:10px}.next{right:10px}.dots{bottom:12px;gap:7px;padding:7px 10px}.dot{width:8px;height:8px}.content-grid{grid-template-columns:1fr;gap:25px;margin-top:30px}.title{font-size:42px}.price{font-size:28px}.features{grid-template-columns:repeat(2,1fr)}.feature{padding:12px 4px;border-bottom:1px solid #e0e4e5}.feature:nth-child(2n){border-right:0}.map-section{margin-top:45px}.map{height:380px}.map iframe{height:380px}.map-open{display:block}}

<body>
<header class="header">
<a class="logo" href="index.html"><div class="logo-circle">JT</div><div class="logo-text"><strong>JO TORRES</strong><span>CONSULTOR IMOBILIÁRIO</span></div></a>
<button class="mobile-menu-toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
<nav class="navigation" id="navigation"><a href="index.html">Início</a><a href="imoveis.html">Imóveis</a><a href="index.html#sobre">Sobre mim</a><a href="index.html#contacto">Contacto</a><a class="whatsapp" href="https://wa.me/41792601145" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a></nav>
</header>
<main class="page">
<a class="back" href="imoveis.html"><i class="fa-solid fa-arrow-left"></i> Voltar aos imóveis</a>
<div id="app" class="loading">A carregar imóvel...</div>
</main>
<script>
'use strict';
const SUPABASE_URL='https://scmorocdbdyvnxodpwyi.supabase.co';
const SUPABASE_KEY='sb_publishable_W28Qdq8POfYXjCu3BwUxPQ_2z2o2GcM';
const id=new URLSearchParams(location.search).get('id');
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>v==null||v===''?'Preço sob consulta':new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(v));
const safe=v=>v==null||v===''?'—':esc(v);
function publicImage(path){return path?`${SUPABASE_URL}/storage/v1/object/public/imoveis/${String(path).split('/').map(encodeURIComponent).join('/')}`:'';}
function restUrl(table,params){return `${SUPABASE_URL}/rest/v1/${table}?${params}`;}
async function fetchJson(url){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),10000);
  try{
    const r=await fetch(url,{signal:controller.signal,headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,Accept:'application/json'}});
    const text=await r.text();
    if(!r.ok) throw new Error(`Supabase ${r.status}: ${text.slice(0,300)}`);
    return text?JSON.parse(text):[];
  }finally{clearTimeout(timer);}
}
function mapUrl(address){return 'https://maps.google.com/maps?q='+encodeURIComponent(address)+'&t=m&z=16&ie=UTF8&iwloc=B&output=embed';}
function mapsUrl(address){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(address);}
function updateSEO(p,title,location,description,image){
 const canonical='https://jotorresfnai.github.io/imovel.html?id='+encodeURIComponent(p.id);
 const desc=(description?String(description).replace(/\s+/g,' ').trim():`${title}${location?' em '+location:''} — imóvel disponível através de Jo Torres.`).substring(0,155);
 const seo=(p.seo_titulo||`${title}${location?' em '+location:''}`)+' | Jo Torres';
 document.title=seo;
 const set=(sel,val,attr='content')=>{const e=document.querySelector(sel);if(e)e.setAttribute(attr,val);};
 set('meta[name="description"]',desc);set('#canonical',canonical,'href');set('#ogUrl',canonical);set('#ogTitle',seo);set('#ogDescription',desc);set('#ogImage',image||'https://jotorresfnai.github.io/og-imovel.jpg');set('#twitterTitle',seo);set('#twitterDescription',desc);set('#twitterImage',image||'https://jotorresfnai.github.io/og-imovel.jpg');
}
function renderGallery(rows,title){
 if(!rows.length)return '<div class="map-empty" style="height:100%;display:grid;place-items:center;color:#687277">Sem fotografias disponíveis.</div>';
 return rows.map((p,i)=>{const src=p.url||publicImage(p.storage_path);return `<div class="slide ${i===0?'active':''}" data-index="${i}"><img class="property-image" src="${esc(src)}" alt="${esc(title)} — fotografia ${i+1}" loading="${i?'lazy':'eager'} onerror="this.style.display='none'"><img class="fnai-watermark" src="/fnai_logo_transparente.png" alt="FNAI" width="100" height="66"></div>`}).join('');
}
function initGallery(count){
 if(count<2)return;
 let current=0,timer;
 const slides=[...document.querySelectorAll('.slide')],dots=[...document.querySelectorAll('.dot')];
 const show=n=>{current=(n+count)%count;slides.forEach((x,i)=>x.classList.toggle('active',i===current));dots.forEach((x,i)=>x.classList.toggle('active',i===current));};
 const start=()=>{clearInterval(timer);timer=setInterval(()=>show(current+1),5000)};
 document.getElementById('prev').onclick=()=>{show(current-1);start()};document.getElementById('next').onclick=()=>{show(current+1);start()};dots.forEach(d=>d.onclick=()=>{show(Number(d.dataset.i));start()});start();
}
async function load(){
 if(!id){app.className='error';app.innerHTML='<h1>Imóvel não especificado</h1><p>O endereço não contém o ID do imóvel.</p>';return;}
 try{
   const pRows=await fetchJson(restUrl('imoveis',`select=*&id=eq.${encodeURIComponent(id)}&limit=1`));
   if(!pRows.length)throw new Error('Imóvel não encontrado.');
   const p=pRows[0];
   const photos=await fetchJson(restUrl('imovel_fotos',`select=*&imovel_id=eq.${encodeURIComponent(id)}&order=ordem.asc`));
   const rows=(photos||[]).filter(x=>x.url||x.storage_path);
   if(!rows.length&&p.imagem_capa)rows.push({url:p.imagem_capa});
   const title=p.titulo||'Imóvel',address=p.endereco||'',loc=p.localizacao||'',description=p.descricao||'',energy=String(p.categoria_energetica||'').trim();
   const mainImage=rows[0]?(rows[0].url||publicImage(rows[0].storage_path)):(p.imagem_capa||'');
   updateSEO(p,title,loc||address,description,mainImage);
   const gallery=renderGallery(rows,title);
   const dots=rows.map((_,i)=>`<button type="button" class="dot ${i?'':'active'}" data-i="${i}" aria-label="Fotografia ${i+1}"></button>`).join('');
   app.className='';app.innerHTML=`
<section class="gallery" id="gallery">${gallery}${rows.length>1?'<button type="button" class="slide-btn prev" id="prev" aria-label="Anterior"><i class="fa-solid fa-chevron-left"></i></button><button type="button" class="slide-btn next" id="next" aria-label="Seguinte"><i class="fa-solid fa-chevron-right"></i></button><div class="dots">'+dots+'</div>':''}</section>
<section class="content-grid"><div><div class="eyebrow">${esc(p.estado||'Disponível')}</div><h1 class="title">${esc(title)}</h1><div class="location"><i class="fa-solid fa-location-dot"></i>${esc(loc||address)}</div><div class="price">${money(p.preco)}</div>
<div class="features"><div class="feature"><i class="fa-solid fa-bed"></i><strong>${safe(p.quartos??0)}</strong><span>Quartos</span></div><div class="feature"><i class="fa-solid fa-bath"></i><strong>${safe(p.casas_banho??0)}</strong><span>WC</span></div><div class="feature"><i class="fa-solid fa-ruler-combined"></i><strong>${safe(p.area??0)}</strong><span>m²</span></div><div class="feature"><i class="fa-solid fa-car"></i><strong>${p.garagem?'Sim':'Não'}</strong><span>Garagem</span></div><div class="feature"><i class="fa-solid fa-person-swimming"></i><strong>${p.piscina?'Sim':'Não'}</strong><span>Piscina</span></div></div>
<div class="tags">${p.garagem?'<span class="tag"><i class="fa-solid fa-car"></i> Garagem</span>':''}${p.piscina?'<span class="tag"><i class="fa-solid fa-person-swimming"></i> Piscina</span>':''}${p.luxo?'<span class="tag"><i class="fa-solid fa-gem"></i> Luxo</span>':''}</div>
<section class="description"><h2>Descrição</h2><p>${esc(description)}</p></section>
${energy?`<section class="energy-section"><div class="energy-label">Categoria Energética</div><div class="energy-symbol">${esc(energy)}</div></section>`:''}
${address?`<section class="address"><h2>Morada</h2><p>${esc(address)}</p></section>`:''}</div>
<aside class="card"><h2>${money(p.preco)}</h2><div class="location"><i class="fa-solid fa-house"></i>${esc(p.tipo||'Imóvel')}</div><p>${esc(loc)}</p><a class="contact-btn" href="https://wa.me/41792601145?text=${encodeURIComponent('Olá, gostaria de obter informações sobre o imóvel '+title)}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> Pedir informações</a>${p.fnai_url?`<a class="fnai-link" href="${esc(p.fnai_url)}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> Ver anúncio na FNAI</a>`:''}</aside></section>
${address?`<section class="map-section"><h2>Localização</h2><div class="map"><iframe src="${esc(mapUrl(address))}" loading="lazy" referrerpolicy="origin" allowfullscreen title="Localização do imóvel"></iframe></div><a class="map-open" href="${esc(mapsUrl(address))}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-location-dot"></i> Abrir localização no Google Maps</a></section>`:''}`;
   initGallery(rows.length);
 }catch(err){
   console.error('Erro ao carregar imóvel:',err);
   app.className='error';
   app.innerHTML=`<h1>Não foi possível carregar o imóvel</h1><p>O servidor demorou demasiado tempo ou devolveu um erro.</p><p class="status error-text">${esc(err.message)}</p><p><a class="contact-btn" href="imoveis.html">Voltar aos imóveis</a></p>`;
 }
}
document.getElementById('menuToggle').addEventListener('click',()=>{const n=document.getElementById('navigation'),b=document.getElementById('menuToggle'),open=n.classList.toggle('mobile-open');b.setAttribute('aria-expanded',open?'true':'false');});
load();
</script>
</body>
</html>
