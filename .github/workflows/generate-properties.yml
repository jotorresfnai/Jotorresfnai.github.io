name: Gerar páginas dos imóveis

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Corrigir painel, homepage e gerador
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---------- painel ----------
          path = Path("painel.html")
          text = path.read_text(encoding="utf-8")
          original = text

          if "let autoSlug=true;" not in text:
              marker = "function openNew(){"
              if marker not in text:
                  raise SystemExit("Não encontrei openNew() no painel.")
              text = text.replace(marker, "let autoSlug=true;\n\n" + marker, 1)

          text = text.replace(
              "function openNew(){\n\n$('propertyForm').reset();",
              "function openNew(){\n\nautoSlug=true;\n\n$('propertyForm').reset();",
              1,
          )
          text = text.replace(
              "$('propertyId').value='';\n\n$('modalTitle').textContent=",
              "$('propertyId').value='';\n\n$('publicado').checked=true;\n\n$('modalTitle').textContent=",
              1,
          )
          text = text.replace(
              "async function editProperty(id){\n\nconst result =",
              "async function editProperty(id){\n\nautoSlug=false;\n\nconst result =",
              1,
          )
          text = text.replace(
              "$('slug').value=p.slug || '';",
              "$('slug').value=p.slug || slugify(p.titulo || '');",
              1,
          )

          pattern = re.compile(
              r"\['titulo','localizacao','seo_titulo','seo_descricao','slug'\]\.forEach\(id=>\$\(id\)\.addEventListener\('input',\(\)=>\{.*?\}\)\);",
              re.S,
          )
          replacement = """$('titulo').addEventListener('input',()=>{
            if(autoSlug) $('slug').value=slugify($('titulo').value);
            if(!$('seo_titulo').value.trim()) $('seo_titulo').value=$('titulo').value.trim() ? $('titulo').value.trim()+' | Jo Torres Imobiliário' : '';
            updateSeoPreview();
          });

          $('slug').addEventListener('input',()=>{
            autoSlug=false;
            updateSeoPreview();
          });

          ['localizacao','seo_titulo','seo_descricao'].forEach(id=>$(id).addEventListener('input',updateSeoPreview));"""
          text, count = pattern.subn(replacement, text, count=1)
          if count == 0 and "$('titulo').addEventListener('input'" not in text:
              raise SystemExit("Não encontrei o listener antigo do slug.")

          if text != original:
              path.write_text(text, encoding="utf-8")

          # ---------- homepage ----------
          index = Path("index.html")
          index_text = index.read_text(encoding="utf-8")
          index_original = index_text

          index_text = re.sub(r"\.limit\(\d+\);", ".limit(12);", index_text, count=1)
          index_text = re.sub(
              r'(fa-bed[\s\S]{0,1200}?<span>)pessoas(</span>)',
              r'\1Quartos\2',
              index_text,
              count=1,
              flags=re.I,
          )

          if index_text != index_original:
              index.write_text(index_text, encoding="utf-8")

          # ---------- gerador ----------
          generator = Path("scripts/generate-properties.mjs")
          g = generator.read_text(encoding="utf-8")
          g_original = g

          old_slug = '''function cleanSlug(slug, id) {
  const value = String(slug || "")
    .trim()
    .toLowerCase()
    .replace(/^\\/+|\\/+$/g, "");

  if (value) {
    return value
      .replace(/[^a-z0-9À-ÿ_-]+/gi, "-")
      .replace(/-+/g, "-")
      .replace(/^-|-$/g, "");
  }

  return `imovel-${id}`;
}'''

          new_slug = '''function slugify(value) {
  return String(value ?? "")
    .normalize("NFD")
    .replace(/[\\u0300-\\u036f]/g, "")
    .toLowerCase()
    .replace(/&/g, " e ")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");
}

function cleanSlug(slug, title, id) {
  const supplied = String(slug || "").trim();
  const candidate = supplied || String(title || "").trim();
  const cleaned = slugify(candidate);

  return cleaned || `imovel-${id}`;
}'''

          if old_slug in g:
              g = g.replace(old_slug, new_slug, 1)
          else:
              # Também aceita a versão já parcialmente corrigida.
              g = re.sub(
                  r"function cleanSlug\(slug, id\) \{.*?\n\}",
                  new_slug,
                  g,
                  count=1,
                  flags=re.S,
              )

          g = g.replace(
              "cleanSlug(property.slug, property.id)",
              "cleanSlug(property.slug, property.titulo, property.id)",
              1,
          )

          # O gerador é a fonte da verdade para /imoveis/: apaga páginas antigas
          # para que um slug alterado/removido não fique publicado por engano.
          old_root = '''  const outputRoot =
    path.join(process.cwd(), "imoveis");

  fs.mkdirSync(outputRoot, {
    recursive: true
  });'''

          new_root = '''  const outputRoot =
    path.join(process.cwd(), "imoveis");

  fs.mkdirSync(outputRoot, {
    recursive: true
  });

  // Todas as pastas dentro de /imoveis são geradas automaticamente.
  // Remove páginas antigas antes de regenerar, evitando slugs órfãos.
  for (const entry of fs.readdirSync(outputRoot, { withFileTypes: true })) {
    if (entry.isDirectory()) {
      fs.rmSync(path.join(outputRoot, entry.name), {
        recursive: true,
        force: true
      });
    }
  }'''

          if old_root in g:
              g = g.replace(old_root, new_root, 1)

          if g != g_original:
              generator.write_text(g, encoding="utf-8")

          print("Gerador corrigido:", g != g_original)
          PY

      - name: Guardar correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add painel.html index.html scripts/generate-properties.mjs
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Fix automatic property slugs and stale pages"
            git push
          fi

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar scripts
        run: |
          echo "Commit atual:"
          git rev-parse HEAD
          ls -la scripts
          test -f scripts/generate-properties.mjs
          test -f scripts/add-gallery-slideshow.mjs

      - name: Gerar páginas dos imóveis
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node scripts/generate-properties.mjs
          node scripts/add-gallery-slideshow.mjs

      - name: Corrigir fundo das miniaturas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path("imoveis").glob("*/index.html"):
              html = path.read_text(encoding="utf-8")
              html = re.sub(r'(\.gallery-thumbs-wrap\s*\{.*?background:)#07171b(;.*?\})', r'\1#ffffff\2', html, flags=re.S)
              html = re.sub(r'(\.gallery-thumb\s*\{.*?background:)#172126(;.*?\})', r'\1#ffffff\2', html, flags=re.S)
              path.write_text(html, encoding="utf-8")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
