name: Gerar páginas dos imóveis

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar scripts
        run: |
          echo "Branch atual:"
          git branch --show-current
          echo "Commit atual:"
          git rev-parse HEAD
          echo "Scripts disponíveis:"
          ls -la scripts
          test -f scripts/generate-properties.mjs
          test -f scripts/add-gallery-slideshow.mjs

      - name: Gerar páginas dos imóveis
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node scripts/generate-properties.mjs
          node scripts/add-gallery-slideshow.mjs

      - name: Guardar páginas geradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add imoveis sitemap.xml

          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
            exit 0
          fi

          git commit -m "Atualizar páginas e sitemap dos imóveis"
          git push
