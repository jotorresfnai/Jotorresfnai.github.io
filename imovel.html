<style>

html,

/* =========================================================

.logo-text strong{

.mobile-menu-toggle{

}

/* =========================================================
   PÁGINA
========================================================= */

.page{
  width:min(1380px,92%);

.back{

  gap:8px;

/* =========================================================
   GALERIA
========================================================= */

.gallery{
  position:relative;
  width:100%;
  height:min(68vw,700px);
  min-height:430px;
  background:#0c191c;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 15px 45px rgba(0,0,0,.12)
}

.slide{
  position:absolute;
  inset:0;
  display:none
}

.slide.active{
  display:block
}

.slide img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  background:#0c191c
}

.slide img.broken{
  object-fit:contain;
  padding:30px
}

.slide-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:5;
  width:52px;
  height:52px;
  border-radius:50%;
  border:0;
  background:rgba(7,23,27,.75);

}

.prev{

}

.next{

}

.dots{

  z-index:6;

  bottom:20px;

.dot{

========================================================= */

/* =========================================================
   MAPA
========================================================= */

/*
  IMPORTANTE:
  O mapa deixa de depender de altura implícita.
  Isto evita o problema de o iframe aparecer no PC
  mas ficar invisível/sem altura em determinados

*/

  margin-top:60px;

.map{

  width:100%;
  height:520px;

  border-radius:18px;
  overflow:hidden;
  background:#e8ebec;

  position:absolute;

  display:block;
  width:100%;
  height:100%;
  min-width:100%;
  min-height:100%;
  border:0;
  margin:0;
  padding:0
}

.map-empty{
  height:100%;
  min-height:300px;
  display:grid;
  place-items:center;
  color:var(--muted);
  padding:30px;
  text-align:center

/* =========================================================
   MINIATURAS
========================================================= */

.thumbs{
  display:flex;
  gap:8px;

.thumb{
  width:82px;

.thumb.active{

.thumb img{

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
'https://scmorocdbdyvnxodpwyi.supabase.co';

const SUPABASE_KEY =
'sb_publishable_W28Qdq8POfYXjCu3BwUxPQ_2z2o2GcM';

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   ID DO IMÓVEL
========================================================= */

const id =
new URLSearchParams(location.search).get('id');

const app =
document.getElementById('app');


/* =========================================================
   MENU MOBILE
========================================================= */

document
.getElementById('menuToggle')
.addEventListener('click',()=>{

  const n =
  document.getElementById('navigation');

  const b =
  document.getElementById('menuToggle');

  const open =
  n.classList.toggle('mobile-open');

  b.setAttribute(
    'aria-expanded',
    open ? 'true' : 'false'
  );

});


/* =========================================================
   SEGURANÇA
========================================================= */

function esc(v){

  return String(v ?? '')
  .replace(
    /[&<>"']/g,
    c=>({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'

    }[c])
  );

}


/* =========================================================
   URL DE IMAGEM SUPABASE
========================================================= */

function publicUrl(path){

  return path
    ?
    sb.storage
      .from('imoveis')
      .getPublicUrl(path)
      .data.publicUrl
    :
    '';

}


/* =========================================================
   CANDIDATOS DE IMAGEM
========================================================= */

function candidates(photo){

  const a=[];

  if(photo?.url){

    a.push(photo.url);

  }

  if(photo?.storage_path){

    a.push(
      publicUrl(photo.storage_path)
    );

  }

  return [
    ...new Set(
      a.filter(Boolean)
    )
  ];

}


/* =========================================================
   HTML DA IMAGEM
========================================================= */

function imageHtml(
  photo,
  i,
  title
){

  const srcs =
  candidates(photo);

  return `

<img
class="property-image"
data-sources="${esc(JSON.stringify(srcs))}"
src="${esc(srcs[0]||'')}"
alt="${esc(title)} — fotografia ${i+1}"
loading="${i?'lazy':'eager'}"
decoding="async"
onerror="tryNextImage(this)"
>

`;

}


/* =========================================================
   FALLBACK DE IMAGENS
========================================================= */

function tryNextImage(img){

  let sources=[];

  try{

    sources =
    JSON.parse(
      img.dataset.sources || '[]'
    );

  }catch(e){}

  const next =
  Number(
    img.dataset.sourceIndex || 0
  ) + 1;

  if(next < sources.length){

    img.dataset.sourceIndex =
    next;

    img.src =
    sources[next];

    return;

  }

  img.classList.add('broken');

  img.removeAttribute(
    'onerror'
  );

}


/* =========================================================
   MAPA
========================================================= */

function mapUrl(address){

  return (
    'https://www.google.com/maps?q='
    +
    encodeURIComponent(address)
    +
    '&z=16&output=embed'
  );

}


/* =========================================================
   PREÇO
========================================================= */

function money(v){

  if(
    v==null ||
    v===''
  ){

    return 'Preço sob consulta';

  }

  return new Intl.NumberFormat(
    'pt-PT',
    {
      style:'currency',
      currency:'EUR',
      maximumFractionDigits:0
    }
  ).format(
    Number(v)
  );

}


/* =========================================================
   NÚMEROS
========================================================= */

function safeNum(
  v,
  empty='—'
){

  return (
    v==null ||
    v===''
  )
  ?
  empty
  :
  v;

}


/* =========================================================
   ENERGIA
========================================================= */

function energyHtml(e){

  const x =
  String(e||'').trim();

  if(!x){

    return '';

  }

  return `

<section
class="energy-section"
>

<div class="energy-label">
Categoria Energética
</div>

<div class="energy-symbol">
${esc(x)}
</div>

</section>

`;

}


/* =========================================================
   SEO DINÂMICO
========================================================= */

function updateSEO(
  p,
  title,
  location,
  description,
  image
){

  const baseUrl =
  'https://jotorresfnai.github.io/imovel.html';

  const canonicalUrl =
  baseUrl +
  '?id=' +
  encodeURIComponent(p.id);

  const cleanDescription =
  description
  ?
  String(description)
    .replace(/\s+/g,' ')
    .trim()
    .substring(0,155)
  :
  (
    title +
    (
      location
      ?
      ' em ' + location
      :
      ''
    ) +
    ' — imóvel disponível através de Jo Torres.'
  );

  const seoTitle =
  (
    p.seo_titulo
    ||
    title +
    (
      location
      ?
      ' em ' + location
      :
      ''
    )
  )
  +
  ' | Jo Torres';

  document.title =
  seoTitle;


  /* DESCRIPTION */

  let descriptionTag =
  document.querySelector(
    'meta[name="description"]'
  );

  if(!descriptionTag){

    descriptionTag =
    document.createElement('meta');

    descriptionTag.name =
    'description';

    document.head.appendChild(
      descriptionTag
    );

  }

  descriptionTag.content =
  cleanDescription;


  /* ROBOTS */

  let robotsTag =
  document.querySelector(
    'meta[name="robots"]'
  );

  if(robotsTag){

    robotsTag.content =
    'index, follow';

  }


  /* CANONICAL */

  let canonical =
  document.getElementById(
    'canonical'
  );

  if(canonical){

    canonical.href =
    canonicalUrl;

  }


  /* OPEN GRAPH URL */

  const ogUrl =
  document.getElementById(
    'ogUrl'
  );

  if(ogUrl){

    ogUrl.content =
    canonicalUrl;

  }


  /* OPEN GRAPH TITLE */

  const ogTitle =
  document.getElementById(
    'ogTitle'
  );

  if(ogTitle){

    ogTitle.content =
    seoTitle;

  }


  /* OPEN GRAPH DESCRIPTION */

  const ogDescription =
  document.getElementById(
    'ogDescription'
  );

  if(ogDescription){

    ogDescription.content =
    cleanDescription;

  }


  /* OPEN GRAPH IMAGE */

  const ogImage =
  document.getElementById(
    'ogImage'
  );

  if(
    ogImage &&
    image
  ){

    ogImage.content =
    image;

  }


  /* TWITTER */

  const twitterTitle =
  document.getElementById(
    'twitterTitle'
  );

  if(twitterTitle){

    twitterTitle.content =
    seoTitle;

  }


  const twitterDescription =
  document.getElementById(
    'twitterDescription'
  );

  if(twitterDescription){

    twitterDescription.content =
    cleanDescription;

  }


  const twitterImage =
  document.getElementById(
    'twitterImage'
  );

  if(
    twitterImage &&
    image
  ){

    twitterImage.content =
    image;

  }


  /* =====================================================
     DADOS ESTRUTURADOS
  ===================================================== */

  const oldSchema =
  document.getElementById(
    'propertySchema'
  );

  if(oldSchema){

    oldSchema.remove();

  }


  const schema =
  document.createElement(
    'script'
  );

  schema.type =
  'application/ld+json';

  schema.id =
  'propertySchema';


  const schemaData = {

    "@context":
    "https://schema.org",

    "@type":
    "RealEstateListing",

    "name":
    title,

    "url":
    canonicalUrl,

    "description":
    cleanDescription,

    "image":
    image
    ?
    [image]
    :
    [],

    "inLanguage":
    "pt-PT",

    "provider":{

      "@type":
      "Person",

      "name":
      "Jo Torres",

      "jobTitle":
      "Consultor Imobiliário",

      "url":
      "https://jotorresfnai.github.io/"

    }

  };


  if(location){

    schemaData.address = {

      "@type":
      "PostalAddress",

      "addressLocality":
      location,

      "addressCountry":
      "PT"

    };

  }


  if(
    p.preco !== null &&
    p.preco !== undefined &&
    p.preco !== ''
  ){

    schemaData.offers = {

      "@type":
      "Offer",

      "price":
      Number(p.preco),

      "priceCurrency":
      "EUR",

      "availability":
      "https://schema.org/InStock",

      "url":
      canonicalUrl

    };

  }


  if(
    p.area !== null &&
    p.area !== undefined &&
    p.area !== ''
  ){

    schemaData.floorSize = {

      "@type":
      "QuantitativeValue",

      "value":
      Number(p.area),

      "unitCode":
      "MTK"

    };

  }


  if(
    p.quartos !== null &&
    p.quartos !== undefined &&
    p.quartos !== ''
  ){

    schemaData.numberOfRooms =
    Number(p.quartos);

  }


  schema.textContent =
  JSON.stringify(
    schemaData
  );

  document.head.appendChild(
    schema
  );

}


/* =========================================================
   CARREGAR IMÓVEL
========================================================= */

async function load(){

  /* SEM ID */

  if(!id){

    app.className =
    'error';

    app.innerHTML = `

<h1>
Imóvel não especificado
</h1>

<p>
Falta o ID do imóvel no endereço.
</p>

`;

    return;

  }


  /* =====================================================
     BUSCAR IMÓVEL
  ===================================================== */

  const {
    data:p,
    error
  } =
  await sb
  .from('imoveis')
  .select('*')
  .eq('id',id)
  .maybeSingle();


  /* ERRO */

  if(
    error ||
    !p
  ){

    console.error(error);

    app.className =
    'error';

    app.innerHTML = `

<h1>
Imóvel não encontrado
</h1>

<p>
Não foi possível carregar o imóvel selecionado.
</p>

`;

    return;

  }


  /* =====================================================
     BUSCAR FOTOGRAFIAS
  ===================================================== */

  const {
    data:photos,
    error:photoError
  } =
  await sb
  .from('imovel_fotos')
  .select('*')
  .eq('imovel_id',id)
  .order(
    'ordem',
    {
      ascending:true
    }
  );


  if(photoError){

    console.warn(
      photoError
    );

  }


  const rows =
  (photos||[])
  .filter(
    x =>
      x.url ||
      x.storage_path
  );


  /* FOTO DE CAPA */

  if(
    !rows.length &&
    p.imagem_capa
  ){

    rows.push({

      url:
      p.imagem_capa,

      storage_path:
      null,

      ordem:
      0

    });

  }


  /* =====================================================
     DADOS PRINCIPAIS
  ===================================================== */

  const title =
  p.titulo ||
  'Imóvel';

  const address =
  p.endereco ||
  '';

  const loc =
  p.localizacao ||
  '';

  const energy =
  String(
    p.categoria_energetica ||
    ''
  ).trim();

  const description =
  p.descricao ||
  '';


  /* =====================================================
     IMAGEM PRINCIPAL PARA SEO
  ===================================================== */

  let mainImage =
  '';

  if(rows.length){

    const firstSources =
    candidates(
      rows[0]
    );

    mainImage =
    firstSources[0] ||
    '';

  }

  if(
    !mainImage &&
    p.imagem_capa
  ){

    mainImage =
    p.imagem_capa;

  }


  /* =====================================================
     SEO
  ===================================================== */

  updateSEO(
    p,
    title,
    loc || address,
    description,
    mainImage
  );


  /* =====================================================
     GALERIA
  ===================================================== */

  const slides =
  rows
  .map(
    (photo,i)=>

      `<div
        class="slide ${i===0?'active':''}"
        data-index="${i}"
      >
        ${imageHtml(
          photo,
          i,
          title
        )}
      </div>`

  )
  .join('');


  const dots =
  rows
  .map(
    (_,i)=>

      `<span
        class="dot ${i===0?'active':''}"
        data-i="${i}"
        aria-label="Fotografia ${i+1}"
      ></span>`

  )
  .join('');


  const thumbs =
  rows
  .map(
    (photo,i)=>

      `<div
        class="thumb ${i===0?'active':''}"
        data-i="${i}"
      >
        ${imageHtml(
          photo,
          i,
          title
        )}
      </div>`

  )
  .join('');


  /* =====================================================
     CONTEÚDO
  ===================================================== */

  app.className='';


  app.innerHTML = `

<section
class="gallery"
id="gallery"
>

${

  slides ||

  '<div class="map-empty">Sem fotografias disponíveis.</div>'

}

${
  rows.length > 1
  ?

  `
  <button
  class="slide-btn prev"
  id="prev"
  aria-label="Fotografia anterior"
  type="button"
  >

  <i class="fa-solid fa-chevron-left"></i>

  </button>

  <button
  class="slide-btn next"
  id="next"
  aria-label="Fotografia seguinte"
  type="button"
  >

  <i class="fa-solid fa-chevron-right"></i>

  </button>
  `

  :

  ''

}

${
  rows.length > 1
  ?

  `<div class="dots">
  ${dots}
  </div>`

  :

  ''
}

<div class="fnai-watermark">
FNAI
</div>

</section>


${
  rows.length > 1
  ?

  `<div class="thumbs">
  ${thumbs}
  </div>`

  :

  ''
}


<section
class="content-grid"
>

<div>

<div class="eyebrow">
${esc(p.estado || 'Disponível')}
</div>


<h1 class="title">
${esc(title)}
</h1>


<div class="location">

<i class="fa-solid fa-location-dot"></i>

${esc(
  loc ||
  address ||
  ''
)}

</div>


<div class="price">
${money(p.preco)}
</div>


<div class="features">

<div class="feature">

<i class="fa-solid fa-bed"></i>

<strong>
${safeNum(p.quartos,0)}
</strong>

<span>
Quartos
</span>

</div>


<div class="feature">

<i class="fa-solid fa-bath"></i>

<strong>
${safeNum(p.casas_banho,0)}
</strong>

<span>
WC
</span>

</div>


<div class="feature">

<i class="fa-solid fa-ruler-combined"></i>

<strong>
${safeNum(p.area,0)}
</strong>

<span>
m²
</span>

</div>


<div class="feature">

<i class="fa-solid fa-car"></i>

<strong>
${p.garagem ? 'Sim' : 'Não'}
</strong>

<span>
Garagem
</span>

</div>


<div class="feature">

<i class="fa-solid fa-person-swimming"></i>

<strong>
${p.piscina ? 'Sim' : 'Não'}
</strong>

<span>
Piscina
</span>

</div>

</div>


<div class="tags">

${
  p.garagem
  ?

  `
  <span class="tag">

  <i class="fa-solid fa-car"></i>

  Garagem

  </span>
  `

  :

  ''
}


${
  p.piscina
  ?

  `
  <span class="tag">

  <i class="fa-solid fa-person-swimming"></i>

  Piscina

  </span>
  `

  :

  ''
}


${
  p.luxo
  ?

  `
  <span class="tag">

  <i class="fa-solid fa-gem"></i>

  Luxo

  </span>
  `

  :

  ''
}

</div>


<section
class="description"
>

<h2>
Descrição
</h2>

<p>
${esc(description)}
</p>

</section>


${energyHtml(energy)}


${
  address
  ?

  `
  <section
  class="address"
  >

  <h2>
  Morada
  </h2>

  <p>
  ${esc(address)}
  </p>

  </section>
  `

  :

  ''
}

</div>


<aside class="card">

<h2>
${money(p.preco)}
</h2>


<div class="location">

<i class="fa-solid fa-house"></i>

${esc(
  p.tipo ||
  'Imóvel'
)}

</div>


<p class="muted">
${esc(loc)}
</p>


<a
class="contact-btn"
href="https://wa.me/41792601145?text=${encodeURIComponent(
  'Olá, gostaria de obter informações sobre o imóvel ' +
  title
)}"
target="_blank"
rel="noopener"
>

<i class="fa-brands fa-whatsapp"></i>

Pedir informações

</a>


${
  p.fnai_url
  ?

  `
  <a
  class="fnai-link"
  href="${esc(p.fnai_url)}"
  target="_blank"
  rel="noopener"
  >

  <i class="fa-solid fa-arrow-up-right-from-square"></i>

  Ver anúncio na FNAI

  </a>
  `

  :

  ''
}

</aside>

</section>


${
  address
  ?

  `
  <section
  class="map-section"
  >

  <h2>
  Localização
  </h2>

  <div class="map">

  <iframe
  src="${esc(mapUrl(address))}"
  loading="lazy"
  referrerpolicy="no-referrer-when-downgrade"
  allowfullscreen
  title="Localização do imóvel ${esc(title)}"
  ></iframe>

  </div>

  </section>
  `

  :

  ''
}

`;


  /* =====================================================
     GALERIA — CONTROLOS
  ===================================================== */

  let current =
  0;


  const slideEls =
  [
    ...document.querySelectorAll(
      '.slide'
    )
  ];


  const dotEls =
  [
    ...document.querySelectorAll(
      '.dot'
    )
  ];


  const thumbEls =
  [
    ...document.querySelectorAll(
      '.thumb'
    )
  ];


  function show(n){

    if(
      !slideEls.length
    ){

      return;

    }


    current =
    (
      n +
      slideEls.length
    )
    %
    slideEls.length;


    slideEls.forEach(
      (s,i)=>

        s.classList.toggle(
          'active',
          i===current
        )
    );


    dotEls.forEach(
      (d,i)=>

        d.classList.toggle(
          'active',
          i===current
        )
    );


    thumbEls.forEach(
      (t,i)=>

        t.classList.toggle(
          'active',
          i===current
        )
    );

  }


  document
  .getElementById('prev')
  ?.addEventListener(
    'click',
    ()=>show(current-1)
  );


  document
  .getElementById('next')
  ?.addEventListener(
    'click',
    ()=>show(current+1)
  );


  dotEls.forEach(
    d =>

      d.addEventListener(
        'click',
        ()=>show(
          Number(
            d.dataset.i
          )
        )
      )
  );


  thumbEls.forEach(
    t =>

      t.addEventListener(
        'click',
        ()=>show(
          Number(
            t.dataset.i
          )
        )
  );

}


/* =========================================================
   INICIAR
========================================================= */

load();

</script>

</body>
</html>
