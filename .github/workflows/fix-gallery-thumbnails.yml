name: Fix property gallery thumbnails
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gallery thumbnails
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import re
          for p in Path('imoveis').glob('*/index.html'):
              s=p.read_text(encoding='utf-8')
              if 'property-gallery' not in s and 'property-thumb' not in s and '.gallery' not in s:
                  continue

              slides=re.findall(r'<div class="property-slide[^>]*>\s*<img[^>]+src="([^"]+)"',s)
              if slides:
                  def repl(m):
                      i=repl.n; repl.n+=1
                      if i>=len(slides): return m.group(0)
                      return re.sub(r'<img\b[^>]*src="[^"]*"', lambda x: re.sub(r'src="[^"]*"', 'src="'+slides[i]+'"', x.group(0)), m.group(0), count=1)
                  repl.n=0
                  s=re.sub(r'<button class="property-thumb[^>]*>.*?</button>', repl, s, flags=re.S)

              css='''\n<style id="jo-gallery-white-background">\n/* Galerias: manter as miniaturas sempre com fundo branco. */\n.property-thumb,\n.property-thumb img,\n.gallery-thumb,\n.gallery-thumb img,\n.gallery-thumbnails,\n.gallery-thumbnails img,\n.thumbnails,\n.thumbnails img {\n  background:#fff !important;\n}\n</style>\n'''
              if 'id="jo-gallery-white-background"' not in s:
                  s=s.replace('</head>',css+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY2
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imoveis/*/index.html
          git diff --cached --quiet || git commit -m 'Fix white background for property gallery thumbnails'
          git push
