<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imóvel | Jo Torres</title>
<meta name="version" content="2026-08-16-property-v2">
<meta name="description" content="Detalhes do imóvel — Jo Torres, Consultor Imobiliário.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--dark:#07171b;--gold:#c9a34a;--text:#263238;--muted:#687277;--bg:#f5f6f6;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;padding:0;overflow-x:hidden}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{text-decoration:none;color:inherit}
.header{height:82px;background:var(--dark);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:relative;z-index:100;color:#fff}
.logo{display:flex;align-items:center;gap:12px}.logo-circle{width:48px;height:48px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font:700 18px Georgia,serif}
.logo-text strong{display:block;letter-spacing:2px;font-size:17px}.logo-text span{display:block;color:#b9c1c3;font-size:10px;letter-spacing:2px}
.navigation{display:flex;align-items:center;gap:26px}.navigation a{font-size:14px;color:#fff}.navigation a:hover{color:var(--gold)}
.navigation .whatsapp{background:var(--gold);color:var(--dark);padding:10px 15px;border-radius:7px;font-weight:800}
.mobile-menu-toggle{display:none;border:0;background:none;color:#fff;font-size:30px;width:46px;height:46px}
.page{width:min(1380px,92%);margin:auto;padding:30px 0 80px}.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;margin-bottom:20px}
#app > .gallery{position:relative!important;width:100%!important;height:min(68vw,700px)!important;min-height:430px;background:#0c191c;border-radius:18px;overflow:hidden;box-shadow:0 15px 45px rgba(0,0,0,.12)}
#app > .gallery .slide{position:absolute!important;inset:0!important;display:none!important;width:100%!important;height:100%!important}#app > .gallery .slide.active{display:block!important}#app > .gallery .slide img{width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;object-fit:cover!important;display:block!important;background:#0c191c}
#app > .gallery .slide img.broken{object-fit:contain!important;padding:30px}.slide-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:52px;height:52px;border-radius:50%;border:0;background:rgba(7,23,27,.75);color:#fff;font-size:21px;cursor:pointer}
.prev{left:20px}.next{right:20px}.dots{position:absolute;z-index:6;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.55);cursor:pointer}.dot.active{background:var(--gold);transform:scale(1.15)}
#app > .gallery .fnai-watermark{position:absolute;right:25px;bottom:18px;z-index:6;color:#fff;font-weight:900;font-size:28px;text-shadow:0 2px 5px rgba(0,0,0,.6);letter-spacing:1px}
.content-grid{display:grid;grid-template-columns:minmax(0,1.75fr) 360px;gap:45px;margin-top:45px}
.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:var(--gold);text-transform:uppercase}.title{font:700 clamp(40px,5vw,68px)/1.05 Georgia,serif;color:var(--dark);margin:7px 0 12px}
.location{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:17px}.location i{color:var(--gold)}.price{font-size:34px;font-weight:900;color:var(--dark);margin:20px 0 28px}
.features{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #e0e4e5;border-bottom:1px solid #e0e4e5;padding:20px 0;margin-bottom:32px}
.feature{text-align:center;border-right:1px solid #e0e4e5}.feature:last-child{border-right:0}.feature i{display:block;color:var(--gold);font-size:18px;margin-bottom:4px}.feature strong{display:block;font-size:17px;color:var(--dark)}.feature span{font-size:11px;color:var(--muted)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 28px}.tag{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #e1e5e6;border-radius:7px;padding:7px 10px;color:#596367;font-size:12px;font-weight:800}
.description,.address,.energy-section{margin-top:32px}.description h2,.address h2,.map-section h2{font:700 32px Georgia,serif;color:var(--dark);margin:0 0 12px}.description p,.address p{white-space:pre-line;color:#596367;font-size:16px;margin:0}
.card{background:#fff;border-radius:16px;border:1px solid #e4e8e9;padding:25px;box-shadow:0 10px 35px rgba(0,0,0,.06);height:max-content}.card h2{font:700 28px Georgia,serif;color:var(--dark);margin:0 0 18px}
.contact-btn{display:flex;justify-content:center;align-items:center;gap:9px;background:var(--dark);color:#fff;border-radius:8px;padding:14px;font-weight:800}.fnai-link{display:flex;justify-content:center;align-items:center;gap:8px;color:#8a6a18;font-weight:800;font-size:13px;margin-top:16px}
.energy{border-top:1px solid #e7e9ea;margin-top:22px;padding-top:20px}.energy-label{font-size:13px;color:var(--muted);margin-bottom:9px}.energy-symbol{width:52px;height:52px;background:#69a93e;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900;border-radius:2px}
.map-section{margin-top:60px}.map{height:520px;width:100%;border-radius:18px;overflow:hidden;background:#e8ebec;border:1px solid #dfe4e5}.map iframe{width:100%;height:100%;border:0}.map-empty{height:100%;display:grid;place-items:center;color:var(--muted);padding:30px;text-align:center}
.thumbs{display:flex;gap:8px;overflow:auto;margin-top:10px}.thumb{width:82px;height:58px;flex:0 0 82px;border:2px solid transparent;border-radius:6px;overflow:hidden;cursor:pointer;background:#ddd}.thumb.active{border-color:var(--gold)}.thumb img{width:100%;height:100%;object-fit:cover}
.loading,.error{padding:60px;text-align:center;background:#fff;border-radius:16px}
@media(max-width:760px){
.header{height:78px}.mobile-menu-toggle{display:grid;place-items:center;position:relative;z-index:1003}
.navigation{position:absolute!important;top:100%!important;left:0!important;width:100%!important;display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:0!important;padding:10px 5% 18px!important;background:var(--dark)!important;opacity:0;visibility:hidden;pointer-events:none;box-shadow:0 14px 28px rgba(0,0,0,.25);transition:.18s}
.navigation.mobile-open{opacity:1;visibility:visible;pointer-events:auto}.navigation a{padding:15px 5px;border-bottom:1px solid rgba(255,255,255,.1);font-size:18px}.navigation .whatsapp{margin-top:12px;text-align:center}
.page{width:92%;padding-top:22px}#app > .gallery{height:65vw!important;min-height:300px!important;border-radius:12px!important}.slide-btn{width:44px;height:44px}.prev{left:10px}.next{right:10px}.fnai-watermark{font-size:22px;right:14px;bottom:12px}
.content-grid{grid-template-columns:1fr;gap:25px;margin-top:30px}.title{font-size:42px}.price{font-size:28px}.features{grid-template-columns:repeat(2,1fr);gap:0}.feature{padding:12px 4px;border-bottom:1px solid #e0e4e5}.feature:nth-child(2n){border-right:0}.map{height:380px}
}
</style>
</head>
<body>
<header class="header">
<a class="logo" href="index.html"><div class="logo-circle">JT</div><div class="logo-text"><strong>JO TORRES</strong><span>CONSULTOR IMOBILIÁRIO</span></div></a>
<button class="mobile-menu-toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
<nav class="navigation" id="navigation"><a href="index.html">Início</a><a href="imoveis.html">Imóveis</a><a href="index.html#sobre">Sobre mim</a><a href="index.html#contacto">Contacto</a><a class="whatsapp" href="https://wa.me/41792601145" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a></nav>
</header>
<main class="page"><a class="back" href="imoveis.html"><i class="fa-solid fa-arrow-left"></i> Voltar aos imóveis</a><div id="app" class="loading">A carregar imóvel...</div></main>
<script>
const SUPABASE_URL='https://scmorocdbdyvnxodpwyi.supabase.co';
const SUPABASE_KEY='sb_publishable_W28Qdq8POfYXjCu3BwUxPQ_2z2o2GcM';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const id=new URLSearchParams(location.search).get('id');
const app=document.getElementById('app');

document.getElementById('menuToggle').addEventListener('click',()=>{
 const n=document.getElementById('navigation'), b=document.getElementById('menuToggle');
 const open=n.classList.toggle('mobile-open'); b.setAttribute('aria-expanded',open?'true':'false');
});

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function publicUrl(path){return path?sb.storage.from('imoveis').getPublicUrl(path).data.publicUrl:''}
function candidates(photo){
 const a=[];
 if(photo?.storage_path)a.push(publicUrl(photo.storage_path));
 if(photo?.url)a.push(photo.url);
 return [...new Set(a.filter(Boolean))];
}
function imageHtml(photo,i,title){
 const srcs=candidates(photo);
 return `<img class="property-image" data-sources="${esc(JSON.stringify(srcs))}" src="${esc(srcs[0]||'')}" alt="${esc(title)} — fotografia ${i+1}" loading="${i?'lazy':'eager'}" decoding="async" onerror="tryNextImage(this)">`;
}
function tryNextImage(img){
 let sources=[];
 try{sources=JSON.parse(img.dataset.sources||'[]')}catch(e){}
 const next=Number(img.dataset.sourceIndex||0)+1;
 if(next<sources.length){img.dataset.sourceIndex=next;img.src=sources[next];return}
 img.classList.add('broken');
 img.removeAttribute('onerror');
}
function mapUrl(address){return 'https://www.google.com/maps?q='+encodeURIComponent(address)+'&z=16&output=embed'}
function money(v){return v==null||v===''?'Preço sob consulta':new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(v))}
function safeNum(v,empty='—'){return v==null||v===''?empty:v}
function energyHtml(e){
 const x=String(e||'').trim();
 if(!x)return '';
 return `<section class="energy-section"><div class="energy-label">Categoria Energética</div><div class="energy-symbol">${esc(x)}</div></section>`;
}

async function load(){
 if(!id){app.className='error';app.innerHTML='<h1>Imóvel não especificado</h1><p>Falta o ID do imóvel no endereço.</p>';return}
 const {data:p,error}=await sb.from('imoveis').select('*').eq('id',id).maybeSingle();
 if(error||!p){console.error('Erro ao carregar imóvel:',error);app.className='error';app.innerHTML='<h1>Imóvel não encontrado</h1><p>Não foi possível carregar o imóvel selecionado.</p>'+(error?'<p style="font-size:12px;color:#8a5555">'+esc(error.message)+'</p>':'');return}

 const {data:photos,error:photoError}=await sb.from('imovel_fotos').select('*').eq('imovel_id',id).order('ordem',{ascending:true});
 if(photoError)console.warn(photoError);
 const rows=(photos||[]).filter(x=>x.url||x.storage_path);
 if(!rows.length&&p.imagem_capa)rows.push({url:p.imagem_capa,storage_path:null,ordem:0});

 const title=p.titulo||'Imóvel', address=p.endereco||'', loc=p.localizacao||'', energy=String(p.categoria_energetica||'').trim();
 document.title=(p.seo_titulo||title)+' | Jo Torres';
 const slides=rows.map((photo,i)=>`<div class="slide ${i===0?'active':''}" data-index="${i}">${imageHtml(photo,i,title)}</div>`).join('');
 const dots=rows.map((_,i)=>`<span class="dot ${i===0?'active':''}" data-i="${i}"></span>`).join('');
 const thumbs=rows.map((photo,i)=>`<div class="thumb ${i===0?'active':''}" data-i="${i}">${imageHtml(photo,i,title)}</div>`).join('');

 app.className='';
 app.innerHTML=`
 <section class="gallery" id="gallery">
   ${slides||'<div class="map-empty">Sem fotografias disponíveis.</div>'}
   ${rows.length>1?'<button class="slide-btn prev" id="prev"><i class="fa-solid fa-chevron-left"></i></button><button class="slide-btn next" id="next"><i class="fa-solid fa-chevron-right"></i></button>':''}
   ${rows.length>1?`<div class="dots">${dots}</div>`:''}
   <div class="fnai-watermark">FNAI</div>
 </section>
 ${rows.length>1?`<div class="thumbs">${thumbs}</div>`:''}
 <section class="content-grid">
  <div>
   <div class="eyebrow">${esc(p.estado||'Disponível')}</div>
   <h1 class="title">${esc(title)}</h1>
   <div class="location"><i class="fa-solid fa-location-dot"></i>${esc(loc||address||'')}</div>
   <div class="price">${money(p.preco)}</div>
   <div class="features">
    <div class="feature"><i class="fa-solid fa-bed"></i><strong>${safeNum(p.quartos,0)}</strong><span>Quartos</span></div>
    <div class="feature"><i class="fa-solid fa-bath"></i><strong>${safeNum(p.casas_banho,0)}</strong><span>WC</span></div>
    <div class="feature"><i class="fa-solid fa-ruler-combined"></i><strong>${safeNum(p.area,0)}</strong><span>m²</span></div>
    <div class="feature"><i class="fa-solid fa-car"></i><strong>${p.garagem?'Sim':'Não'}</strong><span>Garagem</span></div>
    <div class="feature"><i class="fa-solid fa-person-swimming"></i><strong>${p.piscina?'Sim':'Não'}</strong><span>Piscina</span></div>
   </div>
   <div class="tags">
    ${p.garagem?'<span class="tag"><i class="fa-solid fa-car"></i> Garagem</span>':''}
    ${p.piscina?'<span class="tag"><i class="fa-solid fa-person-swimming"></i> Piscina</span>':''}
    ${p.luxo?'<span class="tag"><i class="fa-solid fa-gem"></i> Luxo</span>':''}
   </div>
   <section class="description"><h2>Descrição</h2><p>${esc(p.descricao||'')}</p></section>
   ${energyHtml(energy)}
   ${address?`<section class="address"><h2>Morada</h2><p>${esc(address)}</p></section>`:''}
  </div>
  <aside class="card">
   <h2>${money(p.preco)}</h2>
   <div class="location"><i class="fa-solid fa-house"></i>${esc(p.tipo||'Imóvel')}</div>
   <p class="muted">${esc(loc)}</p>
   ${energyHtml(energy)}
   <a class="contact-btn" href="https://wa.me/41792601145?text=${encodeURIComponent('Olá, gostaria de obter informações sobre o imóvel '+title)}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> Pedir informações</a>
   ${p.fnai_url?`<a class="fnai-link" href="${esc(p.fnai_url)}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> Ver anúncio na FNAI</a>`:''}
  </aside>
 </section>
 ${address?`<section class="map-section"><h2>Localização</h2><div class="map"><iframe src="${esc(mapUrl(address))}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen title="Localização do imóvel"></iframe></div></section>`:''}
 `;

 let current=0;
 const slideEls=[...document.querySelectorAll('.slide')], dotEls=[...document.querySelectorAll('.dot')], thumbEls=[...document.querySelectorAll('.thumb')];
 function show(n){if(!slideEls.length)return;current=(n+slideEls.length)%slideEls.length;slideEls.forEach((s,i)=>s.classList.toggle('active',i===current));dotEls.forEach((d,i)=>d.classList.toggle('active',i===current));thumbEls.forEach((t,i)=>t.classList.toggle('active',i===current))}
 document.getElementById('prev')?.addEventListener('click',()=>show(current-1));
 document.getElementById('next')?.addEventListener('click',()=>show(current+1));
 document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});
 dotEls.forEach(d=>d.addEventListener('click',()=>show(Number(d.dataset.i))));
 thumbEls.forEach(t=>t.addEventListener('click',()=>show(Number(t.dataset.i))));
}
load();
</script>
</body>
</html>
