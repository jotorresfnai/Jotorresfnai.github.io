name: Fix gallery white backgrounds

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fix the four affected property galleries
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('imoveis/quinta-t8-deocriste/index.html'),
              Path('imoveis/moradia-t4-de-luxo/index.html'),
              Path('imoveis/moradia-v4-correlha-ponte-de-lima-com-piscina/index.html'),
          ]
          # Also cover the fourth affected property if it exists under the site.
          fourth = Path('imoveis/moradia-t3-com-suite-arcos-de-valdevez/index.html')
          if fourth.exists():
              files.append(fourth)

          css = '''\n<style id="jo-gallery-white-background-fix">\n/* Correção: slideshow e miniaturas sempre com fundo branco. */\n.gallery-slider,\n.gallery-stage,\n.gallery-thumbs-wrap,\n.gallery-thumbs,\n.gallery-thumb,\n.gallery-thumb img {\n  background:#fff !important;\n}\n</style>\n'''

          changed = []
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if 'jo-gallery-white-background-fix' in text:
                  continue
              marker = '</head>'
              if marker not in text:
                  raise SystemExit(f'Não encontrei </head> em {path}')
              text = text.replace(marker, css + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          # Remove this one-off workflow after applying the fix.
          workflow = Path('.github/workflows/fix-gallery-white.yml')
          if workflow.exists():
              workflow.unlink()

          print('Alterados:', changed)
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imoveis .github/workflows/fix-gallery-white.yml
          if git diff --cached --quiet; then
            echo "Sem alterações."
            exit 0
          fi
          git commit -m "Corrigir fundo branco das galerias dos imóveis"
          git push
