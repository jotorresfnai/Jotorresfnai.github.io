name: Final site cleanup
on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fix-final.mjs
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html imoveis.html imovel.html imoveis scripts/fix-final.mjs .github/workflows/fix-final.yml || true
          git diff --cached --quiet && exit 0
          git commit -m "fix: restaurar watermark transparente e alinhamento dos cards"
          git push
