name: Final site cleanup
on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fix-final.mjs
      - name: Remover fallback quebrado do slideshow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("imovel.html")
          if path.exists():
              html = path.read_text(encoding="utf-8")
              html = re.sub(r'\s*<style id="jo-gallery-thumbnails-restore(?:-v3|-final)?">[\s\S]*?</style>\s*', '\n', html)
              html = re.sub(r'\s*<script id="jo-gallery-thumbnails-restore(?:-v3-js|-final-js)">[\s\S]*?</script>\s*', '\n', html)
              path.write_text(html, encoding="utf-8")
              print("Fallback de galeria removido de imovel.html")
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html imoveis.html imovel.html imoveis scripts/fix-final.mjs .github/workflows/fix-final.yml || true
          git diff --cached --quiet && exit 0
          git commit -m "fix: restaurar slideshow original sem loop"
          git push
