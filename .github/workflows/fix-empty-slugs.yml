name: Fix panel slug generation and publish defaults

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair painel.html
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('painel.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # Existing properties: if the database has no slug, show one generated from the title.
          old = "$('slug').value=p.slug || '';"
          new = "$('slug').value=p.slug || slugify(p.titulo || '');"
          if old in text:
              text = text.replace(old, new, 1)

          # New properties start with automatic slug generation and publication enabled.
          old = "function openNew(){\n\n$('propertyForm').reset();"
          new = "function openNew(){\n\nautoSlug=true;\n\n$('propertyForm').reset();\n\n$('publicado').checked=true;"
          if old in text and new not in text:
              text = text.replace(old, new, 1)

          # Existing properties keep their stored slug. If it is empty, generate it and allow it to follow the title.
          old = "$('propertyId').value=id;\n\n$('modalTitle').textContent=\n'Editar imóvel';"
          new = "$('propertyId').value=id;\n\nautoSlug=!p.slug;\n\n$('modalTitle').textContent=\n'Editar imóvel';"
          if old in text and new not in text:
              text = text.replace(old, new, 1)

          # Replace the old SEO/slug input listener with deterministic behaviour.
          marker = "['titulo','localizacao','seo_titulo','seo_descricao','slug'].forEach(id=>$(id).addEventListener('input',()=>{"
          start = text.find(marker)
          if start != -1:
              end = text.find("\n\n$('propertyForm').onsubmit =", start)
              if end == -1:
                  raise SystemExit('Não encontrei o fim do listener de slug.')
              replacement = '''let autoSlug=true;

$('titulo').addEventListener('input',()=>{
  if(autoSlug) $('slug').value=slugify($('titulo').value);
  if(!$('seo_titulo').value.trim()) $('seo_titulo').value=$('titulo').value.trim() ? $('titulo').value.trim()+' | Jo Torres Imobiliário' : '';
  updateSeoPreview();
});

$('slug').addEventListener('input',()=>{
  autoSlug=false;
  updateSeoPreview();
});

['localizacao','seo_titulo','seo_descricao'].forEach(id=>$(id).addEventListener('input',updateSeoPreview));'''
              text = text[:start] + replacement + text[end:]

          if text == original:
              print('Nenhuma alteração necessária.')
              raise SystemExit(0)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify JavaScript repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('painel.html').read_text(encoding='utf-8')
          required = [
              "$('slug').value=p.slug || slugify(p.titulo || '');",
              "$('publicado').checked=true;",
              "let autoSlug=true;",
              "$('slug').addEventListener('input',()=>{",
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('Correção incompleta. Faltam: ' + ', '.join(missing))
          print('Correção do painel verificada com sucesso.')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add painel.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix automatic property slug and publication"
          git push
