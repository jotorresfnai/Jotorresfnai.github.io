name: Atualizar sitemap

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate-sitemap.mjs"
      - ".github/workflows/generate-properties.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar gerador do sitemap
        run: |
          test -f scripts/generate-sitemap.mjs
          node --check scripts/generate-sitemap.mjs

      - name: Gerar sitemap a partir do Supabase
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/generate-sitemap.mjs

      - name: Validar sitemap
        run: |
          test -f sitemap.xml
          node - <<'NODE'
          const fs = require('fs');
          const xml = fs.readFileSync('sitemap.xml', 'utf8');
          if (!xml.startsWith('<?xml version="1.0" encoding="UTF-8"?>')) throw new Error('Sitemap XML inválido');
          if (!xml.includes('<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">')) throw new Error('Namespace do sitemap inválido');
          const urls = [...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map(m => m[1]);
          if (new Set(urls).size !== urls.length) throw new Error('Sitemap contém URLs duplicados');
          for (const url of urls) {
            if (!url.startsWith('https://jotorresfnai.github.io/')) throw new Error(`URL fora do domínio: ${url}`);
            if (/\/imoveis\/[^/]+\/$/.test(url)) throw new Error(`URL antiga encontrada: ${url}`);
          }
          console.log(`Sitemap válido: ${urls.length} URLs.`);
          NODE

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publish:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
