name: Normalize property galleries

on:
  push:
    paths:
      - 'imoveis/**/index.html'
      - 'scripts/add-gallery-slideshow.mjs'
      - '.github/workflows/normalize-property-galleries.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize generated property pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('imoveis')

          # Apply the same gallery upgrade used by the existing project script.
          subprocess.run(['node', 'scripts/add-gallery-slideshow.mjs'], check=False)

          # Remove accidental duplicated markup introduced in a previous generation.
          for page in root.glob('*/index.html'):
              text = page.read_text(encoding='utf-8')
              fixed = text.replace('<<<<div class="main-grid">', '<div class="main-grid">')
              if fixed != text:
                  page.write_text(fixed, encoding='utf-8')
                  print('Fixed:', page)
          PY

      - name: Commit normalized pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imoveis/*/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Normalize property gallery pages"
            git push
          fi
