name: Gerar páginas dos imóveis

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar gerador único
        run: |
          test -f scripts/generate-properties-v2.mjs
          node --check scripts/generate-properties-v2.mjs
          node --check scripts/patch-imoveis-card.mjs

      - name: Gerar todas as páginas a partir do Supabase
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/generate-properties-v2.mjs

      - name: Corrigir layout dos cartões da página de imóveis
        run: node scripts/patch-imoveis-card.mjs

      - name: Validar integralmente antes de publicar
        run: |
          test -f sitemap.xml
          test -f imoveis.html
          test -d imoveis
          grep -q 'property-actions' imoveis.html
          grep -q 'repeat(auto-fit, minmax(82px, 1fr))' imoveis.html
          grep -q '${garage ?' imoveis.html
          python3 - <<'PY'
          from pathlib import Path
          pages=list(Path("imoveis").glob("*/index.html"))
          if not pages:
              raise SystemExit("Nenhuma página de imóvel foi gerada.")
          failures=[]
          for path in pages:
              html=path.read_text(encoding="utf-8")
              checks={
                "mapa":"data-map-section" in html and "google.com/maps?q=" in html and '<iframe' in html,
                "slideshow":"gallery-slider" in html and "gallery-slide" in html,
                "miniaturas":"gallery-thumbs" in html and "gallery-thumb" in html,
                "main-grid":"class=\"main-grid\"" in html,
                "sem marcador quebrado":"div class=\"main-grid\"" not in html.replace('<div class=\"main-grid\">',''),
              }
              missing=[k for k,v in checks.items() if not v]
              if missing: failures.append(f"{path}: {', '.join(missing)}")
          if failures:
              raise SystemExit("VALIDAÇÃO FALHOU:\n"+"\n".join(failures))
          print(f"Validação OK: {len(pages)} páginas com mapa, slideshow e miniaturas.")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
