  <style>

    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;

    .logo {
      font-size: 22px;

    nav {
      display: flex;

    nav a {

    main {
      max-width: 900px;

    }

    .contact-card {
      background: #ffffff;
      border: 1px solid #e6e9ea;

    h1 {
      margin: 0 0 10px;

    }

    .intro {
      margin: 0 0 30px;
      color: #667174;
      line-height: 1.6;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: 700;
      color: #172126;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #d9dfe1;
      border-radius: 10px;
      padding: 13px 14px;
      font: inherit;
      color: #172126;
      background: #ffffff;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #087f5b;
      box-shadow: 0 0 0 3px rgba(8, 127, 91, 0.10);

      min-height: 160px;

      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    button:hover {
      background: #066b4d;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .65;
      cursor: not-allowed;

    .status {

    .status.success {

      color: #176b4d;
    }

    .status.error {
      display: block;
      background: #fff0f0;

      color: #a52a2a;
    }

      text-align: center;
      padding: 30px 20px;

        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">
      <a class="logo" href="/">Jotorres FNAI</a>

      <nav>
        <a href="/">Início</a>
        <a href="/imoveis.html">Imóveis</a>
        <a href="/contacto.html">Contacto</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="contact-card">

      <h1>Entre em contacto</h1>

      <p class="intro">
        Preencha o formulário e envie-nos a sua mensagem.
        Responderemos assim que possível.
      </p>

      <form id="contactForm">

        <div class="form-grid">

          <div class="form-group">
            <label for="nome">Nome *</label>
            <input
              type="text"
              id="nome"
              name="nome"
              required
              autocomplete="name"
              placeholder="O seu nome">
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
              placeholder="o.seu@email.com">
          </div>

          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input
              type="tel"
              id="telefone"
              name="telefone"
              autocomplete="tel"
              placeholder="912 345 678">
          </div>

          <div class="form-group">
            <label for="assunto">Assunto</label>
            <input
              type="text"
              id="assunto"
              name="assunto"
              value="Contacto através do site"
              placeholder="Assunto">
          </div>

          <div class="form-group full">
            <label for="mensagem">Mensagem *</label>
            <textarea
              id="mensagem"
              name="mensagem"
              required
              placeholder="Escreva aqui a sua mensagem..."></textarea>
          </div>

        </div>
        <div class="submit-area">
  <div class="cf-turnstile"
       data-sitekey="0x4AAAAAAEZaDiev9t4nJjXh"
       data-theme="light">
  </div>

  <button type="submit" id="submitButton">
    Enviar
  </button>
</div>
        
        <div class="submit-area">
          <button type="submit" id="submitButton">
            Enviar
          </button>
        </div>

        <div id="status" class="status"></div>

      </form>

    </section>
  </main>

  <footer>
    © Jotorres FNAI — Todos os direitos reservados.
  </footer>

  <script>
    const SUPABASE_FUNCTION_URL =
      "https://scmorocdbdyvnxodpwyi.supabase.co/functions/v1/smooth-handler";

    const form = document.getElementById("contactForm");
    const button = document.getElementById("submitButton");
    const status = document.getElementById("status");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      status.className = "status";
      status.textContent = "";

      button.disabled = true;
      button.textContent = "A enviar...";

      const data = {
        nome: document.getElementById("nome").value.trim(),
        email: document.getElementById("email").value.trim(),
        telefone: document.getElementById("telefone").value.trim(),
        assunto: document.getElementById("assunto").value.trim(),
        mensagem: document.getElementById("mensagem").value.trim()
      };

      try {
        const response = await fetch(SUPABASE_FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        let result = {};

        try {
          result = await response.json();
        } catch {
          result = {};
        }

        if (!response.ok) {
          throw new Error(
            result.error || "Não foi possível enviar a mensagem."
          );
        }

        status.className = "status success";
        status.textContent =
          "Mensagem enviada com sucesso. Obrigado pelo seu contacto!";

        form.reset();

      } catch (error) {
        console.error("Erro ao enviar contacto:", error);

        status.className = "status error";
        status.textContent =
          error.message ||
          "Ocorreu um erro ao enviar a mensagem. Tente novamente.";
      }

      button.disabled = false;
      button.textContent = "Enviar";
    });
  </script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</body>
</html>
