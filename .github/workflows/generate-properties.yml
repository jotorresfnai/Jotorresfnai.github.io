name: Gerar páginas dos imóveis

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_REGENERATION: "true"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar geradores
        run: |
          test -f scripts/generate-properties.mjs
          test -f scripts/add-gallery-slideshow.mjs
          node --check scripts/generate-properties.mjs
          node --check scripts/add-gallery-slideshow.mjs

      - name: Gerar páginas dos imóveis
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node scripts/generate-properties.mjs
          node scripts/add-gallery-slideshow.mjs

      - name: Adicionar favicon JT
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          favicon = '<link rel="icon" type="image/svg+xml" href="/Jotorresfnai.github.io/favicon.svg">'
          for path in Path('.').rglob('*.html'):
              html = path.read_text(encoding='utf-8')
              if 'href="/Jotorresfnai.github.io/favicon.svg"' in html:
                  continue
              html, count = re.subn(r'(<head[^>]*>)', r'\1\n' + favicon, html, count=1, flags=re.I)
              if count:
                  path.write_text(html, encoding='utf-8')
          PY

      - name: Validar páginas geradas
        run: |
          test -f sitemap.xml
          test -f imoveis.html
          echo "Páginas geradas:"
          find imoveis -mindepth 2 -maxdepth 2 -name index.html | sort

      - name: Remover FNAI dos cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ("index.html", "imoveis.html"):
              path = Path(name)
              if not path.exists():
                  continue
              html = path.read_text(encoding="utf-8")
              html = re.sub(r'<[^>]*class=["\'][^"\']*fnai-watermark[^"\']*["\'][^>]*>.*?</[^>]+>', '', html, flags=re.S|re.I)
              path.write_text(html, encoding="utf-8")
          PY

      - name: Corrigir fundo das miniaturas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path("imoveis").glob("*/index.html"):
              html = path.read_text(encoding="utf-8")
              html = re.sub(r'(\.gallery-thumbs-wrap\s*\{.*?background:)#07171b(;.*?\})', r'\1#ffffff\2', html, flags=re.S)
              html = re.sub(r'(\.gallery-thumb\s*\{.*?background:)#172126(;.*?\})', r'\1#ffffff\2', html, flags=re.S)
              path.write_text(html, encoding="utf-8")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
