<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imóvel | Jo Torres Imobiliário</title>
<meta name="robots" content="index,follow">
<style>
:root{--dark:#07171b;--gold:#c9a34a;--text:#172126;--muted:#687277;--cream:#f7f5f0}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--text)}header{height:78px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 6vw}header a{color:#fff;text-decoration:none}main{width:min(1100px,92%);margin:auto;padding:35px 0 80px}.back{color:var(--muted);font-weight:700}.gallery{display:grid;grid-template-columns:2fr 1fr;gap:5px;height:560px;border-radius:10px;overflow:hidden;margin-top:25px;background:var(--dark)}.gallery img{width:100%;height:100%;object-fit:cover}.gallery img:first-child{grid-row:span 2}.info{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:45px;margin-top:40px}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}h1{font-family:Georgia,serif;font-size:clamp(38px,5vw,62px);line-height:1.05;margin:8px 0}.muted{color:var(--muted)}.price{font-size:30px;font-weight:800;margin:22px 0}.features{display:flex;flex-wrap:wrap;border-top:1px solid #e5e2db;border-bottom:1px solid #e5e2db}.feature{padding:16px 20px;border-right:1px solid #e5e2db}.feature b{display:block}.feature span{font-size:11px;color:var(--muted)}.description{white-space:pre-line;line-height:1.8;color:#596367}.card{background:var(--cream);padding:25px}.btn{display:block;background:var(--dark);color:#fff;text-align:center;padding:14px;border-radius:5px;text-decoration:none;font-weight:800;margin-top:15px}@media(max-width:800px){.gallery{height:400px;grid-template-columns:1fr}.gallery img:first-child{grid-row:auto}.gallery img:nth-child(n+2){display:none}.info{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><a href="/"><strong>JO TORRES</strong><small style="display:block;color:#e2c477;margin-top:4px">CONSULTOR IMOBILIÁRIO</small></a><a href="/imoveis.html">Imóveis</a></header>
<main id="app"><p class="muted">A carregar imóvel…</p></main>
<script>
const SUPABASE_URL='https://scmorocdbdyvnxodpwyi.supabase.co';
const SUPABASE_KEY='sb_publishable_W28Qdq8POfYXjCu3BwUxPQ_2z2o2GcM';
const slug=decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g,'').split('/').pop()||'');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>v==null?'Preço sob consulta':new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(v));
async function load(){
 try{
  const h={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY};
  const r=await fetch(SUPABASE_URL+'/rest/v1/imoveis?select=*&slug=eq.'+encodeURIComponent(slug)+'&publicado=eq.true',{headers:h});
  const rows=await r.json();
  if(!rows.length) throw new Error('Imóvel não encontrado');
  const p=rows[0];
  const fr=await fetch(SUPABASE_URL+'/rest/v1/imovel_fotos?select=url,ordem&imovel_id=eq.'+encodeURIComponent(p.id)+'&order=ordem.asc',{headers:h});
  const photos=await fr.json();
  const urls=[p.imagem_capa,...photos.map(x=>x.url)].filter((x,i,a)=>x&&a.indexOf(x)===i).slice(0,5);
  document.title=(p.seo_titulo||p.titulo)+' | Jo Torres Imobiliário';
  document.getElementById('app').innerHTML=`<a class="back" href="/imoveis.html">← Voltar aos imóveis</a>${urls.length?`<div class="gallery">${urls.map((u,i)=>`<img src="${esc(u)}" alt="${esc(p.titulo)}" ${i?'loading="lazy"':''}>`).join('')}</div>`:''}<div class="info"><section><div class="eyebrow">${esc(p.tipo||'Imóvel')}</div><h1>${esc(p.titulo)}</h1><div class="muted">${esc(p.localizacao||'')}</div><div class="price">${money(p.preco)}</div><div class="features">${p.quartos!=null?`<div class="feature"><b>${esc(p.quartos)}</b><span>Quartos</span></div>`:''}${p.casas_banho!=null?`<div class="feature"><b>${esc(p.casas_banho)}</b><span>Casas de banho</span></div>`:''}${p.area_util!=null?`<div class="feature"><b>${esc(p.area_util)} m²</b><span>Área útil</span></div>`:''}${p.area_bruta!=null?`<div class="feature"><b>${esc(p.area_bruta)} m²</b><span>Área bruta</span></div>`:''}${p.area_terreno!=null?`<div class="feature"><b>${esc(p.area_terreno)} m²</b><span>Terreno</span></div>`:''}${p.area!=null&&!p.area_util?`<div class="feature"><b>${esc(p.area)} m²</b><span>Área</span></div>`:''}</div><h2>Descrição</h2><div class="description">${esc(p.descricao||'Para mais informações, entre em contacto.')}</div></section><aside class="card"><h2>Fale comigo</h2><p class="muted">Interessado neste imóvel? Entre em contacto para informações ou agendar uma visita.</p><a class="btn" href="https://wa.me/41792601145?text=${encodeURIComponent('Olá Jo Torres, tenho interesse no imóvel "'+p.titulo+'".')}">Contactar pelo WhatsApp</a>${p.fnai_url?`<a class="btn" style="background:#c9a34a" href="${esc(p.fnai_url)}" target="_blank" rel="noopener">Ver anúncio na FNAI</a>`:''}</aside></div>`;
 }catch(e){document.getElementById('app').innerHTML='<h1>Página não encontrada</h1><p class="muted">O imóvel pode ter sido removido ou ainda estar a ser publicado.</p><a href="/imoveis.html">Ver imóveis</a>';}
}
load();
</script>
</body>
</html>
