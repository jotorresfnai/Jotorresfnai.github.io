name: Fix empty property slugs

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix edit slug fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('painel.html')
          text = path.read_text(encoding='utf-8')
          original = text

          old = "$('slug').value=p.slug || '';"
          new = "$('slug').value=p.slug || slugify(p.titulo || '');"

          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Não encontrei a linha de preenchimento do slug.')

          if "$('slug').value=slugify(p.titulo || '');" not in text:
              raise SystemExit('A correção do slug não ficou aplicada.')

          if text == original:
              print('Slug fallback já estava corrigido.')
              raise SystemExit(0)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add painel.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix slug display for existing properties"
          git push
