'use strict';


/* =========================================================
   SUPABASE
========================================================= */

const URL_API =
'https://scmorocdbdyvnxodpwyi.supabase.co';

const KEY =
'sb_publishable_W28Qdq8POfYXjCu3BwUxPQ_2z2o2GcM';

const ID =
new URLSearchParams(
  location.search
).get('id');

const APP =
document.getElementById('app');


/* =========================================================
   ESCAPE
========================================================= */

const esc =
v =>
String(v ?? '')
.replace(
  /[&<>"']/g,
  c =>
  ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[c])
);


/* =========================================================
   PREÇO
========================================================= */

const money =
v =>
v == null || v === ''
?
'Preço sob consulta'
:
new Intl.NumberFormat(
  'pt-PT',
  {
    style:'currency',
    currency:'EUR',
    maximumFractionDigits:0
  }
).format(
  Number(v)
);


/* =========================================================
   IMAGEM
========================================================= */

const img =
p =>
p?.url ||
p?.storage_path
?
(
  p.url ||
  URL_API +
  '/storage/v1/object/public/imoveis/' +
  String(
    p.storage_path
  )
  .split('/')
  .map(
    encodeURIComponent
  )
  .join('/')
)
:
'';


/* =========================================================
   API
========================================================= */

async function api(
  table,
  query
){

  const c =
  new AbortController();

  const t =
  setTimeout(
    () => c.abort(),
    7000
  );

  try{

    const r =
    await fetch(
      URL_API +
      '/rest/v1/' +
      table +
      '?' +
      query,
      {
        method:'GET',

        cache:'no-store',

        headers:{
          apikey:KEY,
          Authorization:
            'Bearer ' + KEY,
          Accept:
            'application/json'
        },

        signal:c.signal
      }
    );

    if(!r.ok){

      throw Error(
        'Supabase HTTP ' +
        r.status
      );

    }

    return await r.json();

  }finally{

    clearTimeout(t);

  }

}


/* =========================================================
   META
========================================================= */

function setMeta(
  id,
  v,
  a='content'
){

  const e =
  document.getElementById(id);

  if(e){

    e.setAttribute(
      a,
      v
    );

  }

}


/* =========================================================
   SEO
========================================================= */

function seo(
  p,
  title,
  loc,
  desc,
  image
){

  const canonical =
    'https://jotorresfnai.github.io/imovel.html?id=' +
    encodeURIComponent(p.id);

  const d =
    (
      desc ||
      title +
      (
        loc
        ?
        ' em ' + loc
        :
        ''
      ) +
      ' — imóvel disponível através de Jo Torres.'
    )
    .replace(
      /\s+/g,
      ' '
    )
    .trim()
    .slice(
      0,
      155
    );

  const st =
    (
      p.seo_titulo ||
      title +
      (
        loc
        ?
        ' em ' + loc
        :
        ''
      )
    ) +
    ' | Jo Torres';


  document.title =
    st;


  const m =
    document.querySelector(
      'meta[name="description"]'
    );

  if(m){

    m.content =
    d;

  }


  setMeta(
    'canonical',
    canonical,
    'href'
  );

  setMeta(
    'ogUrl',
    canonical
  );

  setMeta(
    'ogTitle',
    st
  );

  setMeta(
    'ogDescription',
    d
  );

  setMeta(
    'ogImage',
    image ||
    'https://jotorresfnai.github.io/og-imovel.jpg'
  );

  setMeta(
    'twitterTitle',
    st
  );

  setMeta(
    'twitterDescription',
    d
  );

  setMeta(
    'twitterImage',
    image ||
    'https://jotorresfnai.github.io/og-imovel.jpg'
  );

}


/* =========================================================
   RENDER
========================================================= */

function render(
  p,
  photos
){

  const rows =
    (photos || [])
    .filter(
      x =>
        x.url ||
        x.storage_path
    );


  if(
    !rows.length &&
    p.imagem_capa
  ){

    rows.push({
      url:p.imagem_capa
    });

  }


  const title =
    p.titulo ||
    'Imóvel';

  const address =
    p.endereco ||
    '';

  const loc =
    p.localizacao ||
    '';

  const desc =
    p.descricao ||
    '';

  const energy =
    String(
      p.categoria_energetica ||
      ''
    ).trim();

  const main =
    rows.length
    ?
    img(rows[0])
    :
    '';


  seo(
    p,
    title,
    loc || address,
    desc,
    main
  );


  /* =======================================================
     SLIDES
  ======================================================= */

  const slides =
    rows.length
    ?

    rows
    .map(
      (x,i) =>

      '<div class="slide ' +
      (i === 0 ? 'active' : '') +
      '">' +

      '<img ' +

      'class="property-image" ' +

      'src="' +
      esc(img(x)) +
      '" ' +

      'alt="' +
      esc(
        title +
        ' — fotografia ' +
        (i + 1)
      ) +
      '" ' +

      'loading="' +
      (
        i
        ?
        'lazy'
        :
        'eager'
      ) +
      '" ' +

      'decoding="async" ' +

      'onerror="this.classList.add(\'broken\')" ' +

      '>' +

      '</div>'

    )
    .join('')

    :

    '<div style="' +
    'height:100%;' +
    'display:grid;' +
    'place-items:center;' +
    'color:#687277' +
    '">' +
    'Sem fotografias disponíveis.' +
    '</div>';


  /* =======================================================
     DOTS
  ======================================================= */

  const dots =
    rows
    .map(
      (_,i) =>

      '<button ' +

      'class="dot ' +
      (
        i === 0
        ?
        'active'
        :
        ''
      ) +
      '" ' +

      'data-i="' +
      i +
      '" ' +

      'aria-label="Fotografia ' +
      (i + 1) +
      '"' +

      '></button>'

    )
    .join('');


  /* =======================================================
     TAGS
  ======================================================= */

  const tags =

    (
      p.garagem
      ?
      '<span class="tag">' +
      '<i class="fa-solid fa-car"></i> ' +
      'Garagem' +
      '</span>'
      :
      ''
    )

    +

    (
      p.piscina
      ?
      '<span class="tag">' +
      '<i class="fa-solid fa-person-swimming"></i> ' +
      'Piscina' +
      '</span>'
      :
      ''
    )

    +

    (
      p.luxo
      ?
      '<span class="tag">' +
      '<i class="fa-solid fa-gem"></i> ' +
      'Luxo' +
      '</span>'
      :
      ''
    );


  /* =======================================================
     HTML
  ======================================================= */

  APP.className = '';


 APP.innerHTML =

  '<section class="gallery">' +

  '<img ' +
  'class="gallery-watermark" ' +
  'src="https://jotorresfnai.github.io/fnai_logo_transparente.png" ' +
  'alt="" ' +
  'aria-hidden="true" ' +
  'draggable="false" ' +
  '>' +

  slides +
  /*
     WATERMARK ESTÁTICA.
     NÃO É CRIADA NEM ALTERADA PELO JAVASCRIPT.
  */

/* =========================================================
   SLIDESHOW
========================================================= */

function initGallery(n){

  if(n < 2){

    return;

  }


  const slides =
    [
      ...document.querySelectorAll(
        '.slide'
      )
    ];


  const dots =
    [
      ...document.querySelectorAll(
        '.dot'
      )
    ];


  let current = 0;

  let timer = null;


  function show(i){

    current =
      (
        i + n
      ) % n;


    slides.forEach(
      (s,k) => {

        s.classList.toggle(
          'active',
          k === current
        );

      }
    );


    dots.forEach(
      (d,k) => {

        d.classList.toggle(
          'active',
          k === current
        );

      }
    );

  }


  function restart(){

    if(timer){

      clearInterval(
        timer
      );

    }


    timer =
      setInterval(
        () => {

          show(
            current + 1
          );

        },
        5000
      );

  }


  const prev =
    document.getElementById(
      'prev'
    );


  const next =
    document.getElementById(
      'next'
    );


  if(prev){

    prev.onclick =
    () => {

      show(
        current - 1
      );

      restart();

    };

  }


  if(next){

    next.onclick =
    () => {

      show(
        current + 1
      );

      restart();

    };

  }


  dots.forEach(
    d => {

      d.onclick =
      () => {

        show(
          Number(
            d.dataset.i
          )
        );

        restart();

      };

    }
  );


  restart();

}


/* =========================================================
   CARREGAR IMÓVEL
========================================================= */

async function load(){

  if(!ID){

    APP.className =
      'error';


    APP.innerHTML =
      '<h1>' +
      'Imóvel não especificado' +
      '</h1>' +

      '<p>' +
      'Falta o ID do imóvel no endereço.' +
      '</p>';

    return;

  }


  try{

    const result =
      await Promise.allSettled([

        api(
          'imoveis',
          'select=*&id=eq.' +
          encodeURIComponent(ID) +
          '&limit=1'
        ),

        api(
          'imovel_fotos',
          'select=*&imovel_id=eq.' +
          encodeURIComponent(ID) +
          '&order=ordem.asc'
        )

      ]);


    if(
      result[0].status ===
      'rejected'
    ){

      throw result[0].reason;

    }


    const properties =
      result[0].value;


    if(
      !properties.length
    ){

      throw Error(
        'Imóvel não encontrado.'
      );

    }


    const photos =
      result[1].status ===
      'fulfilled'
      ?
      result[1].value
      :
      [];


    render(
      properties[0],
      photos
    );


  }catch(e){

    console.error(e);


    APP.className =
      'error';


    APP.innerHTML =

      '<h1>' +
      'Não foi possível carregar o imóvel' +
      '</h1>' +

      '<p>' +
      esc(
        e.message ||
        'Erro desconhecido'
      ) +
      '</p>' +

      '<p>' +

      '<a ' +
      'class="contact-btn" ' +
      'href="imoveis.html">' +

      'Voltar aos imóveis' +

      '</a>' +

      '</p>';

  }

}
