name: Gerar páginas dos imóveis

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Corrigir painel e listagem da homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("painel.html")
          text = path.read_text(encoding="utf-8")
          original = text

          if "let autoSlug=true;" not in text:
              marker = "function openNew(){"
              if marker not in text:
                  raise SystemExit("Não encontrei openNew() no painel.")
              text = text.replace(marker, "let autoSlug=true;\n\n" + marker, 1)

          text = text.replace(
              "function openNew(){\n\n$('propertyForm').reset();",
              "function openNew(){\n\nautoSlug=true;\n\n$('propertyForm').reset();",
              1,
          )
          text = text.replace(
              "$('propertyId').value='';\n\n$('modalTitle').textContent=",
              "$('propertyId').value='';\n\n$('publicado').checked=true;\n\n$('modalTitle').textContent=",
              1,
          )

          text = text.replace(
              "async function editProperty(id){\n\nconst result =",
              "async function editProperty(id){\n\nautoSlug=false;\n\nconst result =",
              1,
          )
          text = text.replace(
              "$('slug').value=p.slug || '';",
              "$('slug').value=p.slug || slugify(p.titulo || '');",
              1,
          )

          pattern = re.compile(
              r"\['titulo','localizacao','seo_titulo','seo_descricao','slug'\]\.forEach\(id=>\$\(id\)\.addEventListener\('input',\(\)=>\{.*?\}\)\);",
              re.S,
          )
          replacement = """$('titulo').addEventListener('input',()=>{
            if(autoSlug) $('slug').value=slugify($('titulo').value);
            if(!$('seo_titulo').value.trim()) $('seo_titulo').value=$('titulo').value.trim() ? $('titulo').value.trim()+' | Jo Torres Imobiliário' : '';
            updateSeoPreview();
          });

          $('slug').addEventListener('input',()=>{
            autoSlug=false;
            updateSeoPreview();
          });

          ['localizacao','seo_titulo','seo_descricao'].forEach(id=>$(id).addEventListener('input',updateSeoPreview));"""
          text, count = pattern.subn(replacement, text, count=1)
          if count == 0 and "$('titulo').addEventListener('input'" not in text:
              raise SystemExit("Não encontrei o listener antigo do slug.")

          if text != original:
              path.write_text(text, encoding="utf-8")

          index = Path("index.html")
          index_text = index.read_text(encoding="utf-8")
          index_original = index_text

          # Corrige qualquer limite antigo da homepage, não apenas .limit(3).
          index_text = re.sub(
              r"\.limit\(\d+\);",
              ".limit(12);",
              index_text,
              count=1,
          )

          # Corrige apenas a legenda do campo quartos no cartão da homepage.
          # O valor continua a vir de p.quartos; apenas a etiqueta deixa de dizer "pessoas".
          index_text = re.sub(
              r'(fa-bed[\\s\\S]{0,1200}?<span>)pessoas(</span>)',
              r'\1Quartos\2',
              index_text,
              count=1,
              flags=re.I,
          )

          if index_text != index_original:
              index.write_text(index_text, encoding="utf-8")
          PY

      - name: Guardar correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add painel.html index.html
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Fix homepage bedroom label"
            git push
          fi

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar scripts
        run: |
          echo "Commit atual:"
          git rev-parse HEAD
          ls -la scripts
          test -f scripts/generate-properties.mjs
          test -f scripts/add-gallery-slideshow.mjs

      - name: Gerar páginas dos imóveis
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node scripts/generate-properties.mjs
          node scripts/add-gallery-slideshow.mjs

      - name: Corrigir fundo das miniaturas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path("imoveis").glob("*/index.html"):
              html = path.read_text(encoding="utf-8")
              html = re.sub(r'(\.gallery-thumbs-wrap\s*\{.*?background:)#07171b(;.*?\})', r'\1#ffffff\2', html, flags=re.S)
              html = re.sub(r'(\.gallery-thumb\s*\{.*?background:)#172126(;.*?\})', r'\1#ffffff\2', html, flags=re.S)
              path.write_text(html, encoding="utf-8")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
