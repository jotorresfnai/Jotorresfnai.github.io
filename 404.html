<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imóvel | Jo Torres Imobiliário</title>
<meta name="robots" content="index,follow">
<style>
:root{--dark:#07171b;--gold:#c9a34a;--gold-light:#e2c477;--text:#172126;--muted:#687277;--cream:#f7f5f0;--border:#e5e2db}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--text);background:#fff}a{color:inherit;text-decoration:none}
header{height:82px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}header a{color:#fff}header small{display:block;color:var(--gold-light);margin-top:4px;font-size:10px;letter-spacing:1.5px}.nav{font-size:14px}
main{width:min(1200px,92%);margin:auto;padding:30px 0 80px}.back{display:inline-flex;margin-bottom:25px;color:var(--muted);font-weight:700}.back:hover{color:var(--gold)}
.gallery-wrap{position:relative}.gallery{position:relative;height:600px;border-radius:10px;overflow:hidden;background:#fff}.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .35s ease;background:#fff}.slide.active{opacity:1;visibility:visible}.slide img{width:100%;height:100%;display:block;object-fit:cover;background:#fff}.arrow{position:absolute;z-index:5;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;border-radius:50%;background:rgba(7,23,27,.78);color:#fff;cursor:pointer;font-size:20px}.arrow:hover{background:var(--gold)}.prev{left:14px}.next{right:14px}.counter{position:absolute;z-index:5;right:14px;top:14px;background:rgba(7,23,27,.75);color:#fff;padding:7px 10px;border-radius:6px;font-size:12px;font-weight:700}.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;background:#fff}.thumb{flex:0 0 92px;height:68px;border:2px solid transparent;border-radius:7px;overflow:hidden;background:#fff;padding:0;cursor:pointer}.thumb.active{border-color:var(--gold)}.thumb img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}.gallery-empty{height:600px;display:grid;place-items:center;color:var(--muted);background:#fff}
.info{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:55px;margin-top:45px}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase}h1{font-family:Georgia,serif;font-size:clamp(40px,5vw,68px);line-height:1.05;margin:8px 0 12px}.muted{color:var(--muted)}.price{font-size:32px;font-weight:800;margin:25px 0}.features{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:30px}.feature{text-align:center;padding:17px 7px;border-right:1px solid var(--border)}.feature:last-child{border-right:0}.feature b{display:block;font-size:16px}.feature span{font-size:11px;color:var(--muted)}.description{white-space:pre-line;line-height:1.8;color:#596367}.card{background:var(--cream);padding:25px}.btn{display:block;background:var(--dark);color:#fff;text-align:center;padding:14px;border-radius:5px;font-weight:800;margin-top:15px}.btn.gold{background:var(--gold)}
@media(max-width:800px){.gallery{height:400px}.gallery-empty{height:400px}.info{grid-template-columns:1fr;gap:25px}.features{grid-template-columns:repeat(2,1fr)}.feature{border-bottom:1px solid var(--border)}.thumb{flex-basis:76px;height:58px}header{padding:0 18px}.nav{font-size:12px}}
</style>
</head>
<body>
<header><a href="/"><strong>JO TORRES</strong><small>CONSULTOR IMOBILIÁRIO</small></a><a class="nav" href="/imoveis.html">Imóveis</a></header>
<main id="app"><p class="muted">A carregar imóvel…</p></main>
<script>
const SUPABASE_URL='https://scmorocdbdyvnxodpwyi.supabase.co';
const SUPABASE_KEY='sb_publishable_W28Qdq8POfYXjCu3BwUxPQ_2z2o2GcM';
const slug=decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g,'').split('/').pop()||'');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>v==null?'Preço sob consulta':new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(v));
let photos=[];let current=0;
function renderGallery(){
 const g=document.getElementById('gallery');const t=document.getElementById('thumbs');if(!g||!t)return;
 g.innerHTML=photos.length?photos.map((u,i)=>`<div class="slide ${i===current?'active':''}"><img src="${esc(u)}" alt="Fotografia ${i+1}" ${i?'loading="lazy"':''}></div>`).join(''):'<div class="gallery-empty">Sem fotografias disponíveis.</div>';
 t.innerHTML=photos.map((u,i)=>`<button type="button" class="thumb ${i===current?'active':''}" onclick="goSlide(${i})"><img src="${esc(u)}" alt="Miniatura ${i+1}"></button>`).join('');
 const c=document.getElementById('counter');if(c)c.textContent=photos.length?((current+1)+' / '+photos.length):'';
}
function goSlide(i){if(!photos.length)return;current=(i+photos.length)%photos.length;renderGallery()}
function nextSlide(){goSlide(current+1)} function prevSlide(){goSlide(current-1)}
async function load(){
 try{
  const h={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY};
  const r=await fetch(SUPABASE_URL+'/rest/v1/imoveis?select=*&slug=eq.'+encodeURIComponent(slug)+'&publicado=eq.true',{headers:h});
  const rows=await r.json();if(!rows.length)throw new Error('Imóvel não encontrado');
  const p=rows[0];
  const fr=await fetch(SUPABASE_URL+'/rest/v1/imovel_fotos?select=url,ordem&imovel_id=eq.'+encodeURIComponent(p.id)+'&order=ordem.asc',{headers:h});
  const fp=await fr.json();photos=[p.imagem_capa,...fp.map(x=>x.url)].filter((x,i,a)=>x&&a.indexOf(x)===i);current=0;
  document.title=(p.seo_titulo||p.titulo)+' | Jo Torres Imobiliário';
  document.getElementById('app').innerHTML=`<a class="back" href="/imoveis.html">← Voltar aos imóveis</a><div class="gallery-wrap"><div id="gallery" class="gallery"></div>${photos.length>1?'<button class="arrow prev" type="button" onclick="prevSlide()" aria-label="Fotografia anterior">‹</button><button class="arrow next" type="button" onclick="nextSlide()" aria-label="Fotografia seguinte">›</button>':''}<div id="counter" class="counter"></div></div><div id="thumbs" class="thumbs"></div><div class="info"><section><div class="eyebrow">${esc(p.tipo||'Imóvel')}</div><h1>${esc(p.titulo)}</h1><div class="muted">${esc(p.localizacao||'')}</div><div class="price">${money(p.preco)}</div><div class="features">${p.quartos!=null?`<div class="feature"><b>${esc(p.quartos)}</b><span>Quartos</span></div>`:''}${p.casas_banho!=null?`<div class="feature"><b>${esc(p.casas_banho)}</b><span>Casas de banho</span></div>`:''}${p.area_util!=null?`<div class="feature"><b>${esc(p.area_util)} m²</b><span>Área útil</span></div>`:''}${p.area_bruta!=null?`<div class="feature"><b>${esc(p.area_bruta)} m²</b><span>Área bruta</span></div>`:''}${p.area_terreno!=null?`<div class="feature"><b>${esc(p.area_terreno)} m²</b><span>Terreno</span></div>`:''}${p.area!=null&&!p.area_util?`<div class="feature"><b>${esc(p.area)} m²</b><span>Área</span></div>`:''}</div><h2>Descrição</h2><div class="description">${esc(p.descricao||'Para mais informações, entre em contacto.')}</div></section><aside class="card"><h2>Fale comigo</h2><p class="muted">Interessado neste imóvel? Entre em contacto para informações ou agendar uma visita.</p><a class="btn" href="https://wa.me/41792601145?text=${encodeURIComponent('Olá Jo Torres, tenho interesse no imóvel "'+p.titulo+'".')}">Contactar pelo WhatsApp</a>${p.fnai_url?`<a class="btn gold" href="${esc(p.fnai_url)}" target="_blank" rel="noopener">Ver anúncio na FNAI</a>`:''}</aside></div>`;
  renderGallery();
 }catch(e){document.getElementById('app').innerHTML='<h1>Página não encontrada</h1><p class="muted">O imóvel pode ter sido removido ou ainda estar a ser publicado.</p><a href="/imoveis.html">Ver imóveis</a>';}
}
load();
</script>
</body>
</html>
