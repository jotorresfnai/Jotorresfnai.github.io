name: Fix Quinta T8 HTML

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Quinta T8 gallery HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('imoveis/quinta-t8-deocriste/index.html')
          s = p.read_text(encoding='utf-8')

          # Corrige a abertura da secção principal.
          s = s.replace('div class="main-grid">', '<div class="main-grid">')

          # Remove apenas sequências de '<' soltas que possam ter ficado
          # visíveis imediatamente antes da secção principal.
          s = re.sub(r'(<{4,})\s*(?=<div class="main-grid">)', '', s)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imoveis/quinta-t8-deocriste/index.html
          git diff --cached --quiet || git commit -m "Fix Quinta T8 main grid markup"
          git push
