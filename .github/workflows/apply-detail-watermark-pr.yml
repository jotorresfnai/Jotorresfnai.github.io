name: Apply approved FNAI watermark on detail PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'watermark-detail-pages-2026-08-21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watermark-detail-pages-2026-08-21
          fetch-depth: 0
      - name: Apply watermark
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('imovel.html')
          s = p.read_text(encoding='utf-8')
          css = '''.fnai-watermark{\n  position:absolute!important;\n  left:50%!important;\n  top:50%!important;\n  right:auto!important;\n  bottom:auto!important;\n  transform:translate(-50%,-50%)!important;\n  width:100px!important;\n  height:66px!important;\n  background:url('/fnai_logo_transparente.png') center/contain no-repeat!important;\n  color:transparent!important;\n  font-size:0!important;\n  text-shadow:none!important;\n  letter-spacing:0!important;\n  opacity:.8!important;\n  z-index:5!important;\n  pointer-events:none!important;\n}'''
          s, n = re.subn(r'\.fnai-watermark\s*\{.*?\n\}', css, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Watermark CSS block not found; no changes made.')
          old = '<div class="fnai-watermark">\nFNAI\n</div>'
          new = '<img class="fnai-watermark" src="/fnai_logo_transparente.png" alt="FNAI" width="100" height="66">'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'class="fnai-watermark"' not in s:
              raise SystemExit('Watermark HTML element not found; no changes made.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit back to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imovel.html
          git diff --cached --quiet && exit 0
          git commit -m "Add approved FNAI watermark to property detail gallery"
          git push origin HEAD:watermark-detail-pages-2026-08-21
