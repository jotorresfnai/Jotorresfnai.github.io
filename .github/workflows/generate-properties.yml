name: Gerar páginas dos imóveis

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Normalizar painel de imóveis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("painel.html")
          text = path.read_text(encoding="utf-8")
          original = text

          text = re.sub(r'(autoSlug=true;\s*){2,}', 'autoSlug=true;\n', text)
          text = re.sub(r'(autoSlug=false;\s*){2,}', 'autoSlug=false;\n', text)
          text = text.replace('\\small style="display:block;margin-top:7px;color:#6b7280">', '<small style="display:block;margin-top:7px;color:#6b7280">')
          text = text.replace("jotorresfnai.github.io/imovel/'+(slug||'...')", "jotorresfnai.github.io/imoveis/'+(slug||'...')")

          required = [
              "area:Number($('area').value)||null,",
              "area_util:Number($('area_util').value)||null,",
              "area_bruta:Number($('area_bruta').value)||null,",
              "area_terreno:Number($('area_terreno').value)||null,",
          ]
          if not all(x in text for x in required):
              raise SystemExit("O painel não contém todos os campos de área no payload.")

          # O slug é criado automaticamente apenas para imóveis novos.
          # Num imóvel existente, o slug original fica bloqueado/preservado.
          text = text.replace("let autoSlug=true;", "let autoSlug=true;\nlet originalSlug=null;")
          text = text.replace("autoSlug=true;\n$('propertyForm').reset();", "autoSlug=true;\noriginalSlug=null;\n$('slug').disabled=false;\n$('propertyForm').reset();")
          text = text.replace("autoSlug=false;\nconst result =", "autoSlug=false;\nconst result =")
          text = text.replace("$('propertyId').value=id;\n\n$('modalTitle')", "$('propertyId').value=id;\n\noriginalSlug=p.slug || slugify(p.titulo || '');\n$('slug').disabled=true;\n\n$('modalTitle')")
          text = text.replace("slug:slugify($('slug').value.trim() || $('titulo').value.trim()) || null", "slug: id ? (originalSlug || slugify($('slug').value.trim() || $('titulo').value.trim()) || null) : (slugify($('slug').value.trim() || $('titulo').value.trim()) || null)")

          if text != original:
              path.write_text(text, encoding="utf-8")
              print("Painel normalizado com slug persistente.")
          else:
              print("Painel já estava normalizado.")
          PY

      - name: Corrigir gerador de slugs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/generate-properties.mjs")
          text = path.read_text(encoding="utf-8")
          original = text

          old_choose = 'function chooseSlug(property, used){ const base=slugify(property.slug)||slugify(property.titulo)||`imovel-${property.id}`; let slug=base,n=2; while(used.has(slug)) slug=`${base}-${n++}`; used.add(slug); return slug; }'
          new_choose = '''function legacySlugs(root){
            const map = new Map();
            if(!fs.existsSync(root)) return map;
            for(const entry of fs.readdirSync(root,{withFileTypes:true})){
              if(!entry.isDirectory()) continue;
              const file=path.join(root,entry.name,"index.html");
              if(!fs.existsSync(file)) continue;
              try{
                const html=fs.readFileSync(file,"utf8");
                const match=html.match(/<h1>([\\s\\S]*?)<\\/h1>/i);
                if(!match) continue;
                const title=match[1].replace(/<[^>]+>/g,"").trim();
                if(title) map.set(slugify(title),entry.name);
              }catch{}
            }
            return map;
          }
          function chooseSlug(property, used, legacy){
            const legacySlug=legacy.get(slugify(property.titulo));
            const base=legacySlug || slugify(property.slug) || slugify(property.titulo) || `imovel-${property.id}`;
            let slug=base,n=2;
            while(used.has(slug)) slug=`${base}-${n++}`;
            used.add(slug);
            return slug;
          }'''
          if old_choose not in text:
              raise SystemExit("Não encontrei a função chooseSlug esperada.")
          text=text.replace(old_choose,new_choose)

          old_main = '''  const root=path.join(process.cwd(),"imoveis"); fs.mkdirSync(root,{recursive:true});
  for(const e of fs.readdirSync(root,{withFileTypes:true})) if(e.isDirectory()) fs.rmSync(path.join(root,e.name),{recursive:true,force:true});
  const used=new Set(); const urls=[`${SITE_URL}/`,`${SITE_URL}/imoveis.html`];
  for(const p of properties){ const slug=chooseSlug(p,used); const ps=photos.filter(x=>String(x.imovel_id)===String(p.id)); const dir=path.join(root,slug); fs.mkdirSync(dir,{recursive:true}); fs.writeFileSync(path.join(dir,"index.html"),page(p,ps,slug),"utf8"); urls.push(propertyUrl(slug)); console.log(`Gerado: /imoveis/${slug}/`); }'''
          new_main = '''  const root=path.join(process.cwd(),"imoveis"); fs.mkdirSync(root,{recursive:true});
  // Antes de limpar as páginas antigas, recolhe os slugs já publicados.
  // Isto permite recuperar URLs antigas mesmo que o painel tenha gravado um slug errado.
  const legacy=legacySlugs(root);
  for(const e of fs.readdirSync(root,{withFileTypes:true})) if(e.isDirectory()) fs.rmSync(path.join(root,e.name),{recursive:true,force:true});
  const used=new Set(); const urls=[`${SITE_URL}/`,`${SITE_URL}/imoveis.html`];
  for(const p of properties){ const slug=chooseSlug(p,used,legacy); const ps=photos.filter(x=>String(x.imovel_id)===String(p.id)); const dir=path.join(root,slug); fs.mkdirSync(dir,{recursive:true}); fs.writeFileSync(path.join(dir,"index.html"),page(p,ps,slug),"utf8"); urls.push(propertyUrl(slug)); console.log(`Gerado: /imoveis/${slug}/`); }'''
          if old_main not in text:
              raise SystemExit("Não encontrei o bloco principal esperado do gerador.")
          text=text.replace(old_main,new_main)

          if text != original:
              path.write_text(text,encoding="utf-8")
              print("Gerador corrigido: slugs antigos ficam estáveis.")
          else:
              print("Gerador já estava corrigido.")
          PY

      - name: Guardar correções do painel e gerador
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add painel.html scripts/generate-properties.mjs
          if git diff --cached --quiet; then
            echo "Sem alterações para guardar."
          else
            git commit -m "Fix persistent property slugs"
            git push
          fi

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar geradores
        run: |
          test -f scripts/generate-properties.mjs
          test -f scripts/add-gallery-slideshow.mjs
          node --check scripts/generate-properties.mjs
          node --check scripts/add-gallery-slideshow.mjs

      - name: Gerar páginas dos imóveis
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node scripts/generate-properties.mjs
          node scripts/add-gallery-slideshow.mjs

      - name: Validar páginas geradas
        run: |
          test -f sitemap.xml
          test -f imoveis.html
          echo "Páginas geradas:"
          find imoveis -mindepth 2 -maxdepth 2 -name index.html | sort

      - name: Corrigir fundo das miniaturas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path("imoveis").glob("*/index.html"):
              html = path.read_text(encoding="utf-8")
              html = re.sub(r'(\.gallery-thumbs-wrap\s*\{.*?background:)#07171b(;.*?\})', r'\1#ffffff\2', html, flags=re.S)
              html = re.sub(r'(\.gallery-thumb\s*\{.*?background:)#172126(;.*?\})', r'\1#ffffff\2', html, flags=re.S)
              path.write_text(html, encoding="utf-8")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
